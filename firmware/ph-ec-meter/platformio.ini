; Hydroponics pH / EC / temperature meter: ESP32 DevKit + ADS1115 + SSD1306 OLED.
; Build + flash:   pio run -t upload
; Serial console:  pio device monitor   (115200 baud; type "help")

[env:meter]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit ADS1X15@^2.5.0
  olikraus/U8g2@^2.35.0
  paulstoffregen/OneWire@^2.3.8
  milesburton/DallasTemperature@^3.9.0
build_flags =
  -DCORE_DEBUG_LEVEL=0
