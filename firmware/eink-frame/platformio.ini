; E-ink gift frame: DFRobot FireBeetle 2 ESP32-E + Waveshare 7.5" V2 (800x480 B/W).
; Flash one frame:   EINK_TOKEN=<token from the admin page> pio run -t upload
; Serial log:        pio device monitor

[env:frame]
platform = espressif32
board = dfrobot_firebeetle2_esp32e
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
lib_deps =
  zinggjm/GxEPD2@^1.6.0
  olikraus/U8g2_for_Adafruit_GFX@^1.8.0
  bblanchon/ArduinoJson@^7.2.0
  tzapu/WiFiManager@^2.0.17
build_flags =
  -DDEVICE_TOKEN=\"${sysenv.EINK_TOKEN}\"
  -DFW_VERSION=\"1.0.0\"
  -DCORE_DEBUG_LEVEL=0
