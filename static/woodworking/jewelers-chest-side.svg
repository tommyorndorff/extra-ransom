<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" width="780" height="480" role="img" aria-label="Jeweler's traveling chest, side joint layout">
<title>Jeweler's traveling chest, side joint layout</title>
<style>
  .bg{fill:#fff}
  .wood{fill:#ecd2ac;stroke:#4a3320;stroke-width:1.3;stroke-linejoin:round}
  .leg{fill:#dcb988;stroke:#4a3320;stroke-width:1.3}
  .face{fill:#f3dfbf;stroke:#4a3320;stroke-width:1.3}
  .pull{fill:#5a3b26;stroke:#2b1a0f;stroke-width:1}
  .shelf{fill:#e6c79c;stroke:#4a3320;stroke-width:1.3}
  .hid{fill:none;stroke:#7a6a5a;stroke-width:1.1;stroke-dasharray:5 3}
  .spacer{fill:#cfc3b4;stroke:#6b5b4b;stroke-width:1}
  .floor{stroke:#333;stroke-width:1.6}
  .dim{stroke:#1f5fa8;stroke-width:1;fill:none}
  .ext{stroke:#8fb0d8;stroke-width:.8}
  .t{font:12px 'Helvetica Neue',Arial,sans-serif;fill:#1f3a5f}
  .n{font:11px 'Helvetica Neue',Arial,sans-serif;fill:#444}
  .h{font:600 15px 'Helvetica Neue',Arial,sans-serif;fill:#222}
</style>
<defs>
  <marker id="a" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#1f5fa8"/>
  </marker>
</defs>

<defs>
  <pattern id="jh" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="#8a6a4a" stroke-width="1"/>
  </pattern>
</defs>
<style>
  .cut{fill:#d9b27c;stroke:#4a3320;stroke-width:1.2}
  .beyond{fill:#f8f1e6;stroke:#a08f7c;stroke-width:1}
  .groove{fill:#e6d6bf;stroke:#7a6a5a;stroke-width:1;stroke-dasharray:4 2}
  .dt{fill:url(#jh);stroke:#4a3320;stroke-width:1}
</style>
<rect class="bg" width="780" height="480"/>
<text class="h" x="20.0" y="24.0" text-anchor="start">Left side, inside face: joint layout — 1 in = 24 px</text>
<rect class="face" x="130.00" y="90.00" width="288.00" height="312.00"/>
<rect class="groove" x="406.00" y="90.00" width="12.00" height="312.00"/>
<rect class="groove" x="130.00" y="384.00" width="276.00" height="18.00"/>
<line class="ext" x1="406.0" y1="393.0" x2="442.0" y2="393.0"/>
<text class="t" x="445.0" y="397.0" text-anchor="start">groove for the ¾″ bottom: floor to ¾″</text>
<rect class="groove" x="130.00" y="294.00" width="276.00" height="12.00"/>
<line class="ext" x1="406.0" y1="300.0" x2="442.0" y2="300.0"/>
<text class="t" x="445.0" y="304.0" text-anchor="start">groove for the ½″ rail: 4″ to 4½″</text>
<rect class="groove" x="130.00" y="198.00" width="276.00" height="18.00"/>
<line class="ext" x1="406.0" y1="207.0" x2="442.0" y2="207.0"/>
<text class="t" x="445.0" y="211.0" text-anchor="start">shelf through-mortises: 7¾″ to 8½″</text>
<rect class="dt" x="130.00" y="90.00" width="12.00" height="108.00"/>
<line class="ext" x1="142.0" y1="129.6" x2="442.0" y2="129.6"/>
<text class="t" x="445.0" y="133.6" text-anchor="start">dovetails to the ½″ well front: 8½″ to 13″</text>
<text class="n" x="268.0" y="349.0" text-anchor="middle">drawer bay</text>
<text class="n" x="268.0" y="259.0" text-anchor="middle">drawer bay</text>
<text class="n" x="268.0" y="148.0" text-anchor="middle">well</text>
<line class="ext" x1="130.0" y1="46.0" x2="130.0" y2="90.0"/>
<line class="ext" x1="418.0" y1="46.0" x2="418.0" y2="90.0"/>
<line class="dim" x1="130.0" y1="46.0" x2="418.0" y2="46.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="274.0" y="41.0" text-anchor="middle">12″</text>
<line class="ext" x1="406.0" y1="74.0" x2="406.0" y2="90.0"/>
<line class="ext" x1="418.0" y1="74.0" x2="418.0" y2="90.0"/>
<line class="dim" x1="392.0" y1="74.0" x2="406.0" y2="74.0" marker-end="url(#a)"/>
<line class="dim" x1="432.0" y1="74.0" x2="418.0" y2="74.0" marker-end="url(#a)"/>
<text class="t" x="436.0" y="78.0" text-anchor="start">½″ rabbet for the back</text>
<line class="ext" x1="68.0" y1="90.0" x2="130.0" y2="90.0"/>
<line class="ext" x1="68.0" y1="402.0" x2="130.0" y2="402.0"/>
<line class="dim" x1="68.0" y1="90.0" x2="68.0" y2="402.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" transform="translate(62.0,246.0) rotate(-90)" text-anchor="middle">13″</text>
<line class="ext" x1="100.0" y1="90.0" x2="130.0" y2="90.0"/>
<line class="ext" x1="100.0" y1="198.0" x2="130.0" y2="198.0"/>
<line class="dim" x1="100.0" y1="90.0" x2="100.0" y2="198.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" transform="translate(94.0,144.0) rotate(-90)" text-anchor="middle">4½″</text>
<text class="n" x="130.0" y="420.0" text-anchor="start">◀ FRONT edge</text>
<text class="n" x="418.0" y="420.0" text-anchor="end">BACK edge ▶</text>
<text class="n" x="20.0" y="446.0" text-anchor="start">Left side seen from inside the chest. The right side is its mirror image: lay it out with the front edge on the right.</text>
<text class="n" x="20.0" y="462.0" text-anchor="start">Groove, rabbet and tail depths are your choice: add them to the 21″ between-the-sides lengths in the cut list.</text>
</svg>
