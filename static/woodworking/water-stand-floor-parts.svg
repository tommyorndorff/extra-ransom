<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 760" width="1060" height="760" role="img" aria-label="Floor stand parts and joinery">
<title>Floor stand parts and joinery</title>
<style>
  .bg{fill:#fff}
  .wood{fill:#ecd2ac;stroke:#4a3320;stroke-width:1.3;stroke-linejoin:round}
  .leg{fill:#dcb988;stroke:#4a3320;stroke-width:1.3}
  .face{fill:#f3dfbf;stroke:#4a3320;stroke-width:1.3}
  .pull{fill:#5a3b26;stroke:#2b1a0f;stroke-width:1}
  .shelf{fill:#e6c79c;stroke:#4a3320;stroke-width:1.3}
  .hid{fill:none;stroke:#7a6a5a;stroke-width:1.1;stroke-dasharray:5 3}
  .spacer{fill:#cfc3b4;stroke:#6b5b4b;stroke-width:1}
  .floor{stroke:#333;stroke-width:1.6}
  .dim{stroke:#1f5fa8;stroke-width:1;fill:none}
  .ext{stroke:#8fb0d8;stroke-width:.8}
  .t{font:12px 'Helvetica Neue',Arial,sans-serif;fill:#1f3a5f}
  .n{font:11px 'Helvetica Neue',Arial,sans-serif;fill:#444}
  .h{font:600 15px 'Helvetica Neue',Arial,sans-serif;fill:#222}
</style>
<defs>
  <marker id="a" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#1f5fa8"/>
  </marker>
</defs>

<style>
  .post{fill:#dcb988;stroke:#4a3320;stroke-width:1.3;stroke-linejoin:round}
  .ap{fill:#ecd2ac;stroke:#4a3320;stroke-width:1.3;stroke-linejoin:round}
  .shelfp{fill:#e6c79c;stroke:#4a3320;stroke-width:1.3;stroke-linejoin:round}
  .ghost{fill:#eef1f4;fill-opacity:.55;stroke:#6b7885;stroke-width:1.2;stroke-dasharray:6 4}
  .cup{fill:none;stroke:#b0452b;stroke-width:1.2;stroke-dasharray:3 3}
  .ctr{stroke:#999;stroke-width:.8;stroke-dasharray:10 3 2 3}
  .cut{fill:#fff;stroke:#4a3320;stroke-width:1.3}
</style>
<rect class="bg" width="1060" height="760"/>
<text class="h" x="20.0" y="26.0" text-anchor="start">Floor stand — parts and joinery. Countertop stand: the same parts, shorter legs.</text>
<polygon class="post" points="135.0,80.0 120.0,80.0 120.0,113.8 126.6,348.1 135.0,348.1"/>
<text class="h" x="90.0" y="66.0" text-anchor="start">LEG ×4 (inside face on the left; draw it 1:1 for a template)</text>
<rect class="cut" x="120.0" y="105.6" width="5.9" height="6.5"/>
<rect class="cut" x="120.0" y="96.7" width="5.9" height="6.5"/>
<line class="ext" x1="125.9" y1="104.4" x2="159.0" y2="100.4"/>
<text class="n" x="162.0" y="104.4" text-anchor="start">2 Domino mortises 8×40, centred 32½″ up, 1 3/16″ apart (plumb face)</text>
<line class="ext" x1="120.0" y1="113.8" x2="159.0" y2="137.8"/>
<text class="n" x="162.0" y="141.8" text-anchor="start">inside face plumb to 31¼″, then tapers</text>
<line class="ext" x1="135.0" y1="348.1" x2="159.0" y2="344.1"/>
<text class="n" x="162.0" y="348.1" text-anchor="start">top and foot square; 2″ wide at the top, 1⅛″ at the foot</text>
<text class="n" x="90.0" y="370.1" text-anchor="start">blank 2¼″ × 1¼″ × about 36¼″</text>
<text class="n" x="90.0" y="386.1" text-anchor="start">outside edge: plumb;</text>
<text class="n" x="90.0" y="402.1" text-anchor="start">inside edge: plumb to the X, then one taper out</text>
<text class="h" x="640.0" y="72.0" text-anchor="start">LEG section at the mortise (×40/12)</text>
<rect class="post" x="640" y="100" width="80.0" height="50.0"/>
<rect class="cut" x="640" y="118.7" width="31.5" height="12.6"/>
<text class="n" x="640.0" y="166.0" text-anchor="start">2″ × 1¼″; Domino mortise (8 mm, 20 mm deep) on the inside face (left)</text>
<text class="h" x="460.0" y="236.0" text-anchor="start">CROSS MEMBERS ×2 (the X), half-lapped at the centre</text>
<rect class="ap" x="460.0" y="250.0" width="78.0" height="20.0"/>
<rect class="hid" x="460.0" y="251.8" width="6.3" height="6.9"/>
<rect class="hid" x="460.0" y="261.3" width="6.3" height="6.9"/>
<rect class="hid" x="531.7" y="251.8" width="6.3" height="6.9"/>
<rect class="hid" x="531.7" y="261.3" width="6.3" height="6.9"/>
<rect class="cut" x="495.0" y="260.0" width="8.0" height="10.0"/>
<text class="n" x="460.0" y="286.0" text-anchor="start">A: notch from the underside: lap 1″ wide × 1¼″ deep, centred</text>
<rect class="ap" x="460.0" y="360.0" width="78.0" height="20.0"/>
<rect class="hid" x="460.0" y="361.8" width="6.3" height="6.9"/>
<rect class="hid" x="460.0" y="371.3" width="6.3" height="6.9"/>
<rect class="hid" x="531.7" y="361.8" width="6.3" height="6.9"/>
<rect class="hid" x="531.7" y="371.3" width="6.3" height="6.9"/>
<rect class="cut" x="495.0" y="360.0" width="8.0" height="10.0"/>
<text class="n" x="460.0" y="396.0" text-anchor="start">B: notch from the top: lap 1″ wide × 1¼″ deep, centred</text>
<text class="n" x="460.0" y="414.0" text-anchor="start">1″ × 2½″ × 9¾″; two 8×40 Dominos in each end (dashed), 1 3/16″ apart</text>
<text class="n" x="460.0" y="430.0" text-anchor="start">square ends butt the plumb inside faces</text>
<text class="h" x="90.0" y="452.0" text-anchor="start">SHELF ×1 (floor stand only)</text>
<polygon class="shelfp" points="90.0,620.8 240.8,620.8 240.8,470.0 135.0,470.0 90.0,515.0"/>
<line class="dim" x1="90.0" y1="636.8" x2="240.8" y2="636.8" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="165.4" y="652.8" text-anchor="middle">8⅜″ × 8⅜″ × ¾″</text>
<text class="n" x="260.8" y="500.0" text-anchor="start">bottom edge butts the leg on the x axis,</text>
<text class="n" x="260.8" y="516.0" text-anchor="start">right edge butts the leg on the y axis;</text>
<text class="n" x="260.8" y="532.0" text-anchor="start">one 5×30 Domino in each of those edges,</text>
<text class="n" x="260.8" y="548.0" text-anchor="start">centred on the leg, into mortises in the leg face; glued</text>
<text class="n" x="260.8" y="564.0" text-anchor="start">chamfer 2½″ on the outer corner</text>
</svg>
