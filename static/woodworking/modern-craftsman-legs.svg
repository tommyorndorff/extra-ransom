<text class="n" x="20.0" y="594.0" text-anchor="start">Measured down from the leg top (= underside of the table top). Shaded = where the rail meets the leg, flush to the edge named; dark = mortise.</text>
<text class="n" x="20.0" y="610.0" text-anchor="start">Mortises 5/16″–⅜″ wide, 1″ deep, centred on the rail's thickness; ends ¼″ in from the rail's edges (suggested). Miter tenon tips where two meet.</text>
<text class="n" x="20.0" y="626.0" text-anchor="start">Right-hand legs are mirror images. For a Domino build, stagger the mortises instead (see Domino option).</text>
