<line class="ext" x1="360.5" y1="506.0" x2="360.5" y2="476.0"/>
<line class="dim" x1="99.5" y1="506.0" x2="360.5" y2="506.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="230.0" y="521.0" text-anchor="middle">14½″ outside legs</text>
<line class="ext" x1="126.5" y1="536.0" x2="126.5" y2="476.0"/>
<line class="ext" x1="333.5" y1="536.0" x2="333.5" y2="476.0"/>
<line class="dim" x1="126.5" y1="536.0" x2="333.5" y2="536.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="230.0" y="551.0" text-anchor="middle">11½″ between legs</text>
<text class="h" x="680.0" y="56.0" text-anchor="middle">SIDE (front on the right)</text>
<rect class="ghost" x="603.50" y="80.00" width="153.00" height="252.00"/>
<rect class="ghost" x="756.50" y="278.00" width="46.80" height="14.40"/>
