<line class="ctr" x1="796.1" y1="329.0" x2="796.1" y2="476.0"/>
<text class="n" x="804.1" y="337.0" text-anchor="start">cup centre</text>
<line class="ext" x1="505.5" y1="332.0" x2="545.5" y2="332.0"/>
<line class="ext" x1="505.5" y1="476.0" x2="545.5" y2="476.0"/>
<line class="dim" x1="505.5" y1="332.0" x2="505.5" y2="476.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" transform="translate(499.5,404.0) rotate(-90)" text-anchor="middle">8″ under the filter</text>
<line class="ext" x1="549.5" y1="506.0" x2="549.5" y2="476.0"/>
<line class="ext" x1="810.5" y1="506.0" x2="810.5" y2="476.0"/>
<line class="dim" x1="549.5" y1="506.0" x2="810.5" y2="506.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="680.0" y="521.0" text-anchor="middle">14½″ outside legs</text>
<text class="n" x="20.0" y="592.0" text-anchor="start">Front apron is left out so the cup can sit directly under the spigot. A plywood plate glued to the three apron cleats braces the open front; a solid-wood plate is screwed in slots instead (see the plan page).</text>
</svg>
