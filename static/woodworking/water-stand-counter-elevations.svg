<polygon class="post" points="549.5,273.5 576.5,273.5 576.5,377.0 567.5,476.0 549.5,476.0"/>
<polygon class="post" points="810.5,273.5 783.5,273.5 783.5,377.0 792.5,476.0 810.5,476.0"/>
