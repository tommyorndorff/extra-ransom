<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 590" width="730" height="590" role="img" aria-label="Cherry hallway console, front elevation">
<title>Cherry hallway console, front elevation</title>
<style>
