<text class="n" x="20.0" y="782.0" text-anchor="start">Dashed grey = BOROUX 3-Gallon (23″ tall). Its 56¾″ overall height (maker figure) is 2¾″ taller than a 54″ wall-cabinet underside; the 1.8-Gallon (51¼″) fits.</text>
