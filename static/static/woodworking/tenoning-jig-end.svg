<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img" aria-label="Tenoning jig end view">
<title>Tenoning jig end view</title>
<style>
  .bg{fill:#fff}
  .wood{fill:#ecd2ac;stroke:#4a3320;stroke-width:1.3;stroke-linejoin:round}
  .leg{fill:#dcb988;stroke:#4a3320;stroke-width:1.3}
  .face{fill:#f3dfbf;stroke:#4a3320;stroke-width:1.3}
  .pull{fill:#5a3b26;stroke:#2b1a0f;stroke-width:1}
  .shelf{fill:#e6c79c;stroke:#4a3320;stroke-width:1.3}
  .hid{fill:none;stroke:#7a6a5a;stroke-width:1.1;stroke-dasharray:5 3}
  .spacer{fill:#cfc3b4;stroke:#6b5b4b;stroke-width:1}
  .floor{stroke:#333;stroke-width:1.6}
  .dim{stroke:#1f5fa8;stroke-width:1;fill:none}
  .ext{stroke:#8fb0d8;stroke-width:.8}
  .t{font:12px 'Helvetica Neue',Arial,sans-serif;fill:#1f3a5f}
  .n{font:11px 'Helvetica Neue',Arial,sans-serif;fill:#444}
  .h{font:600 15px 'Helvetica Neue',Arial,sans-serif;fill:#222}
</style>
<defs>
  <marker id="a" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#1f5fa8"/>
  </marker>
</defs>
<rect class="bg" width="900" height="640"/>
<text class="h" x="20.0" y="24.0" text-anchor="start">End view looking along the feed — 1 in = 34 px</text>
<rect x="71.6" y="494.0" width="387.6" height="44.2" fill="#d9d9d9" stroke="#555" stroke-width="1.2"/>
<text class="n" x="452.4" y="532.2" text-anchor="end">table</text>
<rect x="143.9" y="494.0" width="25.5" height="12.8" fill="#fff" stroke="#555" stroke-width="1.2"/>
<rect class="spacer" x="144.14" y="494.00" width="24.92" height="11.76"/>
<rect class="face" x="92.00" y="468.50" width="238.00" height="25.50"/>
<rect class="wood" x="304.50" y="154.00" width="25.50" height="314.50"/>
<text class="n" x="207.6" y="485.2" text-anchor="middle">base ¾″ ply</text>
<text class="n" x="296.5" y="290.0" text-anchor="end">fence ¾″ ply</text>
<rect class="spacer" x="330.00" y="239.00" width="23.38" height="255.00"/>
<rect class="shelf" x="353.38" y="188.00" width="25.50" height="306.00"/>
<text class="n" x="384.0" y="409.0" text-anchor="start">stock</text>
<text class="n" x="341.7" y="385.2" text-anchor="middle">shims</text>
<rect x="372.5" y="443.0" width="4.2" height="51.0" fill="#444" stroke="#222"/>
<text class="n" x="386.9" y="468.5" text-anchor="start">blade (kerf)</text>
<path d="M304.5,215.2 L294.3,215.2 L294.3,157.4 L389.1,157.4 L389.1,215.2 L378.9,215.2" fill="none" stroke="#1f5fa8" stroke-width="3"/>
<text class="n" x="341.7" y="149.4" text-anchor="middle">C-clamp: fence back to stock face, above the blade</text>
<line class="ext" x1="330.0" y1="62.0" x2="330.0" y2="443.0"/>
<line class="ext" x1="372.5" y1="62.0" x2="372.5" y2="443.0"/>
<line class="dim" x1="330.0" y1="62.0" x2="372.5" y2="62.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="351.2" y="57.0" text-anchor="middle">A = 1¼″ blade's left plane to fence</text>
<line class="ext" x1="92.0" y1="560.2" x2="92.0" y2="494.0"/>
<line class="ext" x1="330.0" y1="560.2" x2="330.0" y2="494.0"/>
<line class="dim" x1="92.0" y1="560.2" x2="330.0" y2="560.2" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="211.0" y="575.2" text-anchor="middle">base 7″ wide</text>
<line class="ext" x1="330.0" y1="560.2" x2="330.0" y2="494.0"/>
<line class="ext" x1="353.4" y1="560.2" x2="353.4" y2="494.0"/>
<line class="dim" x1="330.0" y1="560.2" x2="353.4" y2="560.2" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="341.7" y="575.2" text-anchor="middle">s = 11/16″ of shims</text>
<line class="ext" x1="353.4" y1="586.2" x2="353.4" y2="494.0"/>
<line class="ext" x1="372.5" y1="586.2" x2="372.5" y2="494.0"/>
<line class="dim" x1="353.4" y1="586.2" x2="372.5" y2="586.2" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="362.9" y="601.2" text-anchor="middle">cheek 9/16″ from stock face</text>
<line class="ext" x1="542.5" y1="443.0" x2="376.8" y2="443.0"/>
<line class="ext" x1="542.5" y1="494.0" x2="376.8" y2="494.0"/>
<line class="dim" x1="542.5" y1="443.0" x2="542.5" y2="494.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" transform="translate(536.5,468.5) rotate(-90)" text-anchor="middle">blade ≈ 1½″ above table</text>
<text class="n" x="75.0" y="620.2" text-anchor="start">Example: ¾″ stock, ⅜″ tenon: s = A − (t + T)/2 = 1¼ − 9/16 = 11/16″. The slot-to-blade distance is saw-dependent;</text>
<text class="n" x="75.0" y="636.2" text-anchor="start">the runner is slotted in the base so you can set A once.</text>
</svg>
