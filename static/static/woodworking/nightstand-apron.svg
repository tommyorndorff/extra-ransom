<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="Heartwood Shaker nightstand, front apron blank">
<title>Heartwood Shaker nightstand, front apron blank</title>
<style>
  .bg{fill:#fff}
  .wood{fill:#ecd2ac;stroke:#4a3320;stroke-width:1.3;stroke-linejoin:round}
  .leg{fill:#dcb988;stroke:#4a3320;stroke-width:1.3}
  .face{fill:#f3dfbf;stroke:#4a3320;stroke-width:1.3}
  .pull{fill:#5a3b26;stroke:#2b1a0f;stroke-width:1}
  .shelf{fill:#e6c79c;stroke:#4a3320;stroke-width:1.3}
  .hid{fill:none;stroke:#7a6a5a;stroke-width:1.1;stroke-dasharray:5 3}
  .spacer{fill:#cfc3b4;stroke:#6b5b4b;stroke-width:1}
  .floor{stroke:#333;stroke-width:1.6}
  .dim{stroke:#1f5fa8;stroke-width:1;fill:none}
  .ext{stroke:#8fb0d8;stroke-width:.8}
  .t{font:12px 'Helvetica Neue',Arial,sans-serif;fill:#1f3a5f}
  .n{font:11px 'Helvetica Neue',Arial,sans-serif;fill:#444}
  .h{font:600 15px 'Helvetica Neue',Arial,sans-serif;fill:#222}
</style>
<defs>
  <marker id="a" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#1f5fa8"/>
  </marker>
</defs>
<rect class="bg" width="640" height="300"/>
<text class="h" x="20.0" y="24.0" text-anchor="start">Front apron blank — 1 in = 24 px</text>
<path class="face" d="M104.0,110.0 L488.0,110.0 L488.0,173.0 A780.0,780.0 0 0 0 104.0,173.0 Z"/>
<rect class="hid" x="80.0" y="120.5" width="24.0" height="42.0"/>
<rect class="hid" x="488.0" y="120.5" width="24.0" height="42.0"/>
<text class="n" x="296.0" y="129.2" text-anchor="middle">front apron ¾″ thick, cherry</text>
<text class="n" x="92.0" y="179.6" text-anchor="middle">tenon</text>
<text class="n" x="500.0" y="179.6" text-anchor="middle">tenon</text>
<line class="ext" x1="80.0" y1="60.0" x2="80.0" y2="110.0"/>
<line class="ext" x1="512.0" y1="60.0" x2="512.0" y2="110.0"/>
<line class="dim" x1="80.0" y1="60.0" x2="512.0" y2="60.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="296.0" y="55.0" text-anchor="middle">18″ cut length (1″ tenons each end)</text>
<line class="ext" x1="104.0" y1="86.0" x2="104.0" y2="110.0"/>
<line class="ext" x1="488.0" y1="86.0" x2="488.0" y2="110.0"/>
<line class="dim" x1="104.0" y1="86.0" x2="488.0" y2="86.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="296.0" y="81.0" text-anchor="middle">16″ shoulder to shoulder = drawer opening</text>
<line class="ext" x1="56.0" y1="110.0" x2="104.0" y2="110.0"/>
<line class="ext" x1="56.0" y1="173.0" x2="104.0" y2="173.0"/>
<line class="dim" x1="56.0" y1="110.0" x2="56.0" y2="173.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" transform="translate(50.0,141.5) rotate(-90)" text-anchor="middle">2⅝″ at ends</text>
<line class="dim" x1="296.0" y1="110.0" x2="296.0" y2="149.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" transform="translate(290.0,129.5) rotate(-90)" text-anchor="middle"></text>
<text class="t" x="304.0" y="167.5" text-anchor="start">1⅝″ at centre</text>
<text class="n" x="296.0" y="243.0" text-anchor="middle">Arc: 1″ rise over a 16″ chord → radius 32.5″. Scribe it with a thin batten sprung through the three points,</text>
<text class="n" x="296.0" y="259.0" text-anchor="middle">or strike it with a trammel. Tenons 1″ long × ~1¾″ wide × 5/16″ thick (est.), centred.</text>
</svg>
