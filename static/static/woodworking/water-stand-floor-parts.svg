<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 700" width="1060" height="700" role="img" aria-label="Floor stand parts and joinery">
<title>Floor stand parts and joinery</title>
<style>
  .bg{fill:#fff}
  .wood{fill:#ecd2ac;stroke:#4a3320;stroke-width:1.3;stroke-linejoin:round}
  .leg{fill:#dcb988;stroke:#4a3320;stroke-width:1.3}
  .face{fill:#f3dfbf;stroke:#4a3320;stroke-width:1.3}
  .pull{fill:#5a3b26;stroke:#2b1a0f;stroke-width:1}
  .shelf{fill:#e6c79c;stroke:#4a3320;stroke-width:1.3}
  .hid{fill:none;stroke:#7a6a5a;stroke-width:1.1;stroke-dasharray:5 3}
  .spacer{fill:#cfc3b4;stroke:#6b5b4b;stroke-width:1}
  .floor{stroke:#333;stroke-width:1.6}
  .dim{stroke:#1f5fa8;stroke-width:1;fill:none}
  .ext{stroke:#8fb0d8;stroke-width:.8}
  .t{font:12px 'Helvetica Neue',Arial,sans-serif;fill:#1f3a5f}
  .n{font:11px 'Helvetica Neue',Arial,sans-serif;fill:#444}
  .h{font:600 15px 'Helvetica Neue',Arial,sans-serif;fill:#222}
</style>
<defs>
  <marker id="a" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#1f5fa8"/>
  </marker>
</defs>

<style>
  .post{fill:#dcb988;stroke:#4a3320;stroke-width:1.3;stroke-linejoin:round}
  .ap{fill:#ecd2ac;stroke:#4a3320;stroke-width:1.3;stroke-linejoin:round}
  .plate{fill:#f3dfbf;stroke:#4a3320;stroke-width:1.3;stroke-linejoin:round}
  .shelfp{fill:#e6c79c;stroke:#4a3320;stroke-width:1.3;stroke-linejoin:round}
  .cleat{fill:#cfa972;stroke:#4a3320;stroke-width:1.1}
  .ghost{fill:#eef1f4;fill-opacity:.55;stroke:#6b7885;stroke-width:1.2;stroke-dasharray:6 4}
  .cup{fill:none;stroke:#b0452b;stroke-width:1.2;stroke-dasharray:3 3}
  .ctr{stroke:#999;stroke-width:.8;stroke-dasharray:10 3 2 3}
  .cut{fill:#fff;stroke:#4a3320;stroke-width:1.3}
</style>
<rect class="bg" width="1060" height="700"/>
<text class="h" x="20.0" y="26.0" text-anchor="start">Floor stand — parts and joinery (1 in = 12 px). Counter stand uses the same parts, shorter.</text>
<g transform="translate(70,80)">
<polygon class="post" points="0.0,0.0 15.0,0.0 15.0,217.5 10.0,277.5 0.0,277.5"/>
<rect class="cut" x="4.38" y="35.00" width="3.75" height="20.00"/>
<rect class="cut" x="4.38" y="196.25" width="3.75" height="12.50"/>
</g>
<text class="h" x="70.0" y="68.0" text-anchor="start">LEG ×4 (inside face)</text>
<line class="dim" x1="115.0" y1="80.0" x2="115.0" y2="357.5" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" transform="translate(129.0,218.8) rotate(-90)" text-anchor="middle">27¾″ (cut 28¼″, trim after joinery)</text>
<line class="ext" x1="78.1" y1="125.0" x2="185.0" y2="119.0"/>
<text class="n" x="188.0" y="123.0" text-anchor="start">mortise ⅜″ × 2″ × 11/16″ deep, centre z 23¼″</text>
<line class="ext" x1="78.1" y1="282.5" x2="185.0" y2="276.5"/>
<text class="n" x="188.0" y="280.5" text-anchor="start">mortise ⅜″ × 1¼″ × 11/16″ deep, centre z 7½″</text>
<line class="ext" x1="85.0" y1="297.5" x2="185.0" y2="337.5"/>
<text class="n" x="188.0" y="341.5" text-anchor="start">taper starts 6″ up; foot 1″ × 1″</text>
<line class="ext" x1="72.2" y1="95.0" x2="185.0" y2="95.0"/>
<text class="n" x="188.0" y="99.0" text-anchor="start">post: 3″ above the apron top, arrises eased ³⁄₁₆″</text>
<text class="n" x="70.0" y="375.5" text-anchor="start">outside arris</text>
<text class="n" x="74.4" y="389.5" text-anchor="start">mortise face is 7/16″ from the outside arris</text>
<text class="h" x="520.0" y="80.0" text-anchor="start">LEG section at the aprons (×40/12)</text>
<rect class="post" x="520" y="120" width="60.0" height="60.0"/>
<rect class="cut" x="552.5" y="137.5" width="27.5" height="15.0"/>
<rect class="cut" x="537.5" y="152.5" width="15.0" height="27.5"/>
<text class="n" x="512.0" y="132.0" text-anchor="end">outside</text>
<text class="n" x="524.0" y="114.0" text-anchor="start">outside face →  (top and left faces are outside)</text>
<text class="n" x="590.0" y="148.0" text-anchor="start">inside face A</text>
<text class="n" x="524.0" y="196.0" text-anchor="start">inside face B</text>
<text class="n" x="524.0" y="214.0" text-anchor="start">7/16″ from the outside arris on both faces; two mortises stop short</text>
<text class="n" x="524.0" y="228.0" text-anchor="start">of each other, so all four legs are identical.</text>
<text class="h" x="520.0" y="286.0" text-anchor="start">TOP APRON ×4  and  LOWER RAIL ×4 (floor stand)</text>
<rect class="ap" x="527.5" y="300.0" width="138.0" height="36.0"/>
<rect class="ap" x="520.0" y="306.0" width="7.5" height="24.0"/>
<rect class="ap" x="665.5" y="306.0" width="7.5" height="24.0"/>
<line class="dim" x1="520.0" y1="352.0" x2="673.0" y2="352.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="596.5" y="366.0" text-anchor="middle">12¾″ overall (shoulders 11½″)</text>
<text class="n" x="687.0" y="322.0" text-anchor="start">3″ wide × ¾″ thick</text>
<text class="n" x="687.0" y="336.0" text-anchor="start">tenon ⅜″ × 2″ × ⅝″</text>
<rect class="ap" x="527.5" y="380.0" width="138.0" height="24.0"/>
<rect class="ap" x="520.0" y="384.5" width="7.5" height="15.0"/>
<rect class="ap" x="665.5" y="384.5" width="7.5" height="15.0"/>
<line class="dim" x1="520.0" y1="420.0" x2="673.0" y2="420.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="596.5" y="434.0" text-anchor="middle">12¾″ overall (shoulders 11½″)</text>
<text class="n" x="687.0" y="396.0" text-anchor="start">2″ wide × ¾″ thick</text>
<text class="n" x="687.0" y="410.0" text-anchor="start">tenon ⅜″ × 1¼″ × ⅝″</text>
<text class="n" x="520.0" y="460.0" text-anchor="start">Tenon is centred on the thickness of the stick; shoulders are cut square all round.</text>
<text class="h" x="520.0" y="484.0" text-anchor="start">PLATE ×1</text>
<polygon class="plate" points="533.5,500.0 655.0,500.0 668.5,513.5 668.5,635.0 655.0,648.5 533.5,648.5 520.0,635.0 520.0,513.5"/>
<line class="dim" x1="520.0" y1="664.5" x2="668.5" y2="664.5" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="594.2" y="678.5" text-anchor="middle">12⅜″ sq. × ¾″</text>
<text class="n" x="682.5" y="550.0" text-anchor="start">corners clipped 1⅛″ × 1⅛″</text>
<text class="n" x="682.5" y="566.0" text-anchor="start">(miter-gauge cuts) so it clears the legs</text>
<text class="n" x="682.5" y="590.0" text-anchor="start">CLEAT ×4: ¾″ × ¾″ × 10″</text>
<text class="n" x="682.5" y="606.0" text-anchor="start">glued under the plate edge, top at 23¼″</text>
<text class="n" x="682.5" y="622.0" text-anchor="start">(= 1½″ below apron top, on the apron's inside face)</text>
<text class="h" x="70.0" y="414.0" text-anchor="start">SHELF ×1 (floor stand only)</text>
<polygon class="shelfp" points="85.8,430.0 222.2,430.0 222.2,445.8 238.0,445.8 238.0,582.2 222.2,582.2 222.2,601.8 238.0,601.8 238.0,613.0 223.0,628.0 85.0,628.0 70.0,613.0 70.0,601.8 85.8,601.8 85.8,582.2 70.0,582.2 70.0,445.8 85.8,445.8"/>
<line class="dim" x1="70.0" y1="644.0" x2="238.0" y2="644.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="154.0" y="658.0" text-anchor="middle">14″ wide × 16½″ deep × ¾″</text>
<line class="dim" x1="256.0" y1="430.0" x2="256.0" y2="628.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="n" x="278.0" y="470.0" text-anchor="start">front corners chamfered 1¼″</text>
<text class="n" x="278.0" y="486.0" text-anchor="start">four leg notches cut 1/16″ oversize</text>
<text class="n" x="278.0" y="502.0" text-anchor="start">back edge ≈ flush with the back rail</text>
<text class="n" x="278.0" y="518.0" text-anchor="start">front tongue reaches under the spigot</text>
</svg>
