<text class="t" x="297.6" y="446.1" text-anchor="start">BRACE (cut 1) — 1″ thick</text>
<text class="n" x="297.6" y="466.1" text-anchor="start">blank 6⅞″ × 9¼″</text>
<text class="n" x="297.6" y="490.1" text-anchor="start">Centreline radius 13″ (inner edge 12⅛″, outer 13⅞″).</text>
<text class="n" x="297.6" y="507.1" text-anchor="start">Centre point: 7⅛″ left of and 3⅛″ above the grid's top-left corner,</text>
<text class="n" x="297.6" y="524.1" text-anchor="start">i.e. off the blank: swing both edges with a trammel from a scrap board.</text>
<text class="n" x="297.6" y="541.1" text-anchor="start">Top end: cut level (sits on the arm underside), 1 13/16″ long, 76° to the arm.</text>
<text class="n" x="297.6" y="558.1" text-anchor="start">Foot end: cut plumb (against the backplate), 2 1/16″ long, 57° to the wall.</text>
<text class="n" x="297.6" y="575.1" text-anchor="start">Chord foot → top 9½″; bow ⅞″.</text>
<text class="n" x="53.4" y="422.3" text-anchor="start">top end (to the arm)</text>
<text class="n" x="53.4" y="749.1" text-anchor="start">foot end (to the backplate) is the left edge</text>
