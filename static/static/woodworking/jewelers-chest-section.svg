<rect class="hid" x="125.00" y="130.00" width="258.00" height="42.00"/>
<text class="n" x="254.0" y="155.2" text-anchor="middle">lift-out tray (1¾″ deep)</text>
<text class="n" x="254.0" y="197.2" text-anchor="middle">well: hammers, mandrels, saw frame, torch tip kit</text>
<rect class="face" x="110.00" y="335.50" width="18.00" height="75.00"/>
