<text class="t" transform="translate(64.0,178.0) rotate(-90)" text-anchor="middle">shelf to tray rim 4″</text>
<line class="ext" x1="458.0" y1="172.0" x2="398.0" y2="172.0"/>
<line class="ext" x1="458.0" y1="226.0" x2="398.0" y2="226.0"/>
<line class="dim" x1="458.0" y1="172.0" x2="458.0" y2="226.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" transform="translate(472.0,199.0) rotate(-90)" text-anchor="middle">2¼″ under tray</text>
<line class="ext" x1="498.0" y1="100.0" x2="398.0" y2="100.0"/>
<line class="ext" x1="498.0" y1="118.0" x2="398.0" y2="118.0"/>
<line class="dim" x1="498.0" y1="100.0" x2="498.0" y2="118.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" transform="translate(512.0,109.0) rotate(-90)" text-anchor="middle">¾″</text>
<line class="ext" x1="110.0" y1="458.0" x2="110.0" y2="430.0"/>
<line class="ext" x1="368.0" y1="458.0" x2="368.0" y2="430.0"/>
<line class="dim" x1="110.0" y1="458.0" x2="368.0" y2="458.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="239.0" y="473.0" text-anchor="middle">drawer 10¾″ front to back</text>
<text class="n" x="20.0" y="520.0" text-anchor="start">Drawer sides ⅜″, bottoms ¼″ in a groove; ¾″ fronts. The ¾″ gap behind the drawers is a dust/stop space.</text>
