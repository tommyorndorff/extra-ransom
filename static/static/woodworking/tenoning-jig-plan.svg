<rect x="330.0" y="80.4" width="3.0" height="403.2" fill="#444" opacity=".35"/>
<text class="n" x="351.0" y="138.0" text-anchor="start">blade plane</text>
<line class="ext" x1="308.2" y1="233.6" x2="348.0" y2="196.4"/>
<text class="n" x="351.0" y="200.4" text-anchor="start">shims, s = 11/16″</text>
<line class="ext" x1="334.5" y1="282.0" x2="348.0" y2="278.0"/>
<text class="n" x="351.0" y="282.0" text-anchor="start">stock (3½″ wide shown)</text>
<text class="n" x="351.0" y="296.0" text-anchor="start">stands on the table, not the base</text>
<text class="n" x="136.8" y="68.4" text-anchor="start">feed ↓</text>
