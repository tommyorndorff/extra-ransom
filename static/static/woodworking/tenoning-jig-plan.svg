<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 586" width="620" height="586" role="img" aria-label="Tenoning jig plan view">
<title>Tenoning jig plan view</title>
<style>
  .bg{fill:#fff}
