<line class="ext" x1="282.0" y1="505.6" x2="282.0" y2="474.0"/>
<line class="ext" x1="300.0" y1="505.6" x2="300.0" y2="474.0"/>
<line class="dim" x1="268.0" y1="505.6" x2="282.0" y2="505.6" marker-end="url(#a)"/>
<line class="dim" x1="314.0" y1="505.6" x2="300.0" y2="505.6" marker-end="url(#a)"/>
<text class="t" x="264.0" y="509.6" text-anchor="end">fence ¾″</text>
<text class="n" x="20.0" y="535.6" text-anchor="start">Grey = printed parts. Runner dashed under the base; ○ = its 6 nut pockets (40 mm pitch).</text>
<text class="n" x="20.0" y="551.6" text-anchor="start">The base slots sit over pockets 1, 3 and 5, 80 mm ≈ 3.15″ apart, so the runner sits 20 mm off centre.</text>
<text class="n" x="20.0" y="567.6" text-anchor="start">Brackets sit near each end; the handle is shown clear of the slots, place it to suit.</text>
</svg>
