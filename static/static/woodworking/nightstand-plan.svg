<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" role="img" aria-label="Heartwood Shaker nightstand, plan view">
<title>Heartwood Shaker nightstand, plan view</title>
<style>
  .bg{fill:#fff}
