<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" width="780" height="440" role="img" aria-label="Jeweler's traveling chest, tray layout">
<title>Jeweler's traveling chest, tray layout</title>
<style>
  .bg{fill:#fff}
  .wood{fill:#ecd2ac;stroke:#4a3320;stroke-width:1.3;stroke-linejoin:round}
  .leg{fill:#dcb988;stroke:#4a3320;stroke-width:1.3}
  .face{fill:#f3dfbf;stroke:#4a3320;stroke-width:1.3}
  .pull{fill:#5a3b26;stroke:#2b1a0f;stroke-width:1}
  .shelf{fill:#e6c79c;stroke:#4a3320;stroke-width:1.3}
  .hid{fill:none;stroke:#7a6a5a;stroke-width:1.1;stroke-dasharray:5 3}
  .spacer{fill:#cfc3b4;stroke:#6b5b4b;stroke-width:1}
  .floor{stroke:#333;stroke-width:1.6}
  .dim{stroke:#1f5fa8;stroke-width:1;fill:none}
  .ext{stroke:#8fb0d8;stroke-width:.8}
  .t{font:12px 'Helvetica Neue',Arial,sans-serif;fill:#1f3a5f}
  .n{font:11px 'Helvetica Neue',Arial,sans-serif;fill:#444}
  .h{font:600 15px 'Helvetica Neue',Arial,sans-serif;fill:#222}
</style>
<defs>
  <marker id="a" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#1f5fa8"/>
  </marker>
</defs>
<rect class="bg" width="780" height="440"/>
<text class="h" x="20.0" y="24.0" text-anchor="start">Lift-out tray, plan — 1 in = 24 px (tray interior 20⅛″ × 10⅛″)</text>
<rect class="wood" x="70.00" y="80.00" width="498.00" height="258.00"/>
<rect class="face" x="79.00" y="89.00" width="111.00" height="240.00"/>
<text class="t" x="134.5" y="203.0" text-anchor="middle">pliers + cutters</text>
<text class="n" x="134.5" y="219.0" text-anchor="middle">jaws up in a</text>
<text class="n" x="134.5" y="233.0" text-anchor="middle">slotted block (8–10)</text>
<rect class="face" x="190.00" y="89.00" width="144.00" height="240.00"/>
<text class="t" x="262.0" y="203.0" text-anchor="middle">files</text>
<text class="n" x="262.0" y="219.0" text-anchor="middle">hand + needle files,</text>
<text class="n" x="262.0" y="233.0" text-anchor="middle">two rows, 6–8″</text>
<rect class="face" x="334.00" y="89.00" width="114.00" height="240.00"/>
<text class="t" x="391.0" y="203.0" text-anchor="middle">measuring</text>
<text class="n" x="391.0" y="219.0" text-anchor="middle">dividers, calipers,</text>
<text class="n" x="391.0" y="233.0" text-anchor="middle">rule, ring sizer</text>
<rect class="face" x="448.00" y="89.00" width="111.00" height="120.00"/>
<text class="n" x="502.0" y="140.0" text-anchor="middle">burnishers,</text>
<text class="n" x="502.0" y="154.0" text-anchor="middle">pushers, scribes</text>
<rect class="face" x="448.00" y="209.00" width="111.00" height="120.00"/>
<text class="n" x="502.0" y="272.0" text-anchor="middle">burs in index</text>
<text class="n" x="502.0" y="286.0" text-anchor="middle">cases, loupes</text>
<line class="ext" x1="70.0" y1="62.0" x2="70.0" y2="80.0"/>
<line class="ext" x1="568.0" y1="62.0" x2="568.0" y2="80.0"/>
<line class="dim" x1="70.0" y1="62.0" x2="568.0" y2="62.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="319.0" y="57.0" text-anchor="middle">20¾″ tray</text>
<line class="ext" x1="40.0" y1="80.0" x2="70.0" y2="80.0"/>
<line class="ext" x1="40.0" y1="338.0" x2="70.0" y2="338.0"/>
<line class="dim" x1="40.0" y1="80.0" x2="40.0" y2="338.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" transform="translate(34.0,209.0) rotate(-90)" text-anchor="middle">10¾″</text>
<text class="n" x="20.0" y="420.0" text-anchor="start">Mitered ⅜″ sides, ¼″ bottom, ¼″ dividers; the front lip is cut down ½″ so the tools read at a glance.</text>
</svg>
