<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" role="img" aria-label="Cherry hallway console, plan view">
<title>Cherry hallway console, plan view</title>
<style>
  .bg{fill:#fff}
  .wood{fill:#ecd2ac;stroke:#4a3320;stroke-width:1.3;stroke-linejoin:round}
  .leg{fill:#dcb988;stroke:#4a3320;stroke-width:1.3}
  .face{fill:#f3dfbf;stroke:#4a3320;stroke-width:1.3}
  .pull{fill:#5a3b26;stroke:#2b1a0f;stroke-width:1}
  .shelf{fill:#e6c79c;stroke:#4a3320;stroke-width:1.3}
  .hid{fill:none;stroke:#7a6a5a;stroke-width:1.1;stroke-dasharray:5 3}
  .spacer{fill:#cfc3b4;stroke:#6b5b4b;stroke-width:1}
  .floor{stroke:#333;stroke-width:1.6}
  .dim{stroke:#1f5fa8;stroke-width:1;fill:none}
  .ext{stroke:#8fb0d8;stroke-width:.8}
  .t{font:12px 'Helvetica Neue',Arial,sans-serif;fill:#1f3a5f}
  .n{font:11px 'Helvetica Neue',Arial,sans-serif;fill:#444}
  .h{font:600 15px 'Helvetica Neue',Arial,sans-serif;fill:#222}
</style>
<defs>
  <marker id="a" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#1f5fa8"/>
  </marker>
</defs>
<rect class="bg" width="760" height="390"/>
<text class="h" x="20.0" y="24.0" text-anchor="start">Plan view, top removed — 1 in = 12 px</text>
<rect class="hid" x="95.0" y="100.0" width="504" height="168"/>
<polygon class="shelf" points="125.0,256.0 569.0,256.0 569.0,238.0 587.0,238.0 587.0,130.0 569.0,130.0 569.0,112.0 125.0,112.0 125.0,130.0 107.0,130.0 107.0,238.0 125.0,238.0"/>
<text class="n" x="347.0" y="188.0" text-anchor="middle">shelf ¾″ × 12″ × 40″ (corners notched 1½″ × 1½″)</text>
<rect class="wood" x="125.00" y="247.00" width="444.00" height="9.00"/>
<rect class="wood" x="125.00" y="112.00" width="444.00" height="9.00"/>
<rect class="wood" x="107.00" y="130.00" width="9.00" height="108.00"/>
<rect class="wood" x="578.00" y="130.00" width="9.00" height="108.00"/>
<rect class="leg" x="107.00" y="238.00" width="18.00" height="18.00"/>
