<rect class="leg" x="569.00" y="238.00" width="18.00" height="18.00"/>
<rect class="leg" x="569.00" y="112.00" width="18.00" height="18.00"/>
<text class="n" x="347.0" y="284.0" text-anchor="middle">FRONT</text>
