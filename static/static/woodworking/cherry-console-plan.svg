<line class="ext" x1="587.0" y1="68.0" x2="587.0" y2="100.0"/>
<line class="ext" x1="599.0" y1="68.0" x2="599.0" y2="100.0"/>
<line class="dim" x1="587.0" y1="68.0" x2="599.0" y2="68.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="593.0" y="63.0" text-anchor="middle">1″</text>
<line class="ext" x1="125.0" y1="302.0" x2="125.0" y2="256.0"/>
<line class="ext" x1="569.0" y1="302.0" x2="569.0" y2="256.0"/>
<line class="dim" x1="125.0" y1="302.0" x2="569.0" y2="302.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="347.0" y="317.0" text-anchor="middle">37″ shoulder to shoulder</text>
<line class="dim" x1="623" y1="268.0" x2="623" y2="100.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" transform="translate(637,184.0) rotate(-90)" text-anchor="middle">14″ overall</text>
<line class="dim" x1="653" y1="256.0" x2="653" y2="112.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" transform="translate(667,184.0) rotate(-90)" text-anchor="middle">12″ leg frame</text>
<line class="dim" x1="71" y1="238.0" x2="71" y2="130.0" marker-start="url(#a)" marker-end="url(#a)"/>
