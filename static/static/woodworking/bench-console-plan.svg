<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440" role="img" aria-label="Console with bench, plan view">
<title>Console with bench, plan view</title>
<style>
  .bg{fill:#fff}
  .wood{fill:#ecd2ac;stroke:#4a3320;stroke-width:1.3;stroke-linejoin:round}
  .leg{fill:#dcb988;stroke:#4a3320;stroke-width:1.3}
  .face{fill:#f3dfbf;stroke:#4a3320;stroke-width:1.3}
  .pull{fill:#5a3b26;stroke:#2b1a0f;stroke-width:1}
  .shelf{fill:#e6c79c;stroke:#4a3320;stroke-width:1.3}
  .hid{fill:none;stroke:#7a6a5a;stroke-width:1.1;stroke-dasharray:5 3}
  .spacer{fill:#cfc3b4;stroke:#6b5b4b;stroke-width:1}
  .floor{stroke:#333;stroke-width:1.6}
  .dim{stroke:#1f5fa8;stroke-width:1;fill:none}
  .ext{stroke:#8fb0d8;stroke-width:.8}
  .t{font:12px 'Helvetica Neue',Arial,sans-serif;fill:#1f3a5f}
  .n{font:11px 'Helvetica Neue',Arial,sans-serif;fill:#444}
  .h{font:600 15px 'Helvetica Neue',Arial,sans-serif;fill:#222}
</style>
<defs>
  <marker id="a" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#1f5fa8"/>
  </marker>
</defs>
<rect class="bg" width="700" height="440"/>
<text class="h" x="20.0" y="24.0" text-anchor="start">Plan view, top removed, bench pushed in — 1 in = 12 px</text>
<rect class="hid" x="95.0" y="100.0" width="504" height="180"/>
<rect class="wood" x="107.00" y="130.00" width="9.00" height="120.00"/>
<rect class="wood" x="578.00" y="130.00" width="9.00" height="120.00"/>
<rect class="wood" x="125.00" y="112.00" width="444.00" height="9.00"/>
<rect class="shelf" x="131.00" y="121.00" width="432.00" height="156.00"/>
<text class="n" x="347.0" y="204.8" text-anchor="middle">bench 36″ × 13″ (lid hinged at the back)</text>
<rect class="wood" x="125.00" y="259.00" width="444.00" height="9.00"/>
<rect class="wood" x="125.00" y="112.00" width="444.00" height="9.00"/>
<rect class="wood" x="107.00" y="130.00" width="9.00" height="120.00"/>
<rect class="wood" x="578.00" y="130.00" width="9.00" height="120.00"/>
<rect class="leg" x="107.00" y="250.00" width="18.00" height="18.00"/>
<rect class="leg" x="107.00" y="112.00" width="18.00" height="18.00"/>
<rect class="leg" x="569.00" y="250.00" width="18.00" height="18.00"/>
<rect class="leg" x="569.00" y="112.00" width="18.00" height="18.00"/>
<text class="n" x="347.0" y="296.0" text-anchor="middle">FRONT (open: no lower front rail)</text>
<text class="n" x="95.0" y="342.0" text-anchor="start">Dashed outline = top, 42″ × 15″ × ¾″. Aprons (upper) and lower rails (below the bench top) are ¾″ thick,</text>
<text class="n" x="95.0" y="358.0" text-anchor="start">flush to the leg outer faces. The bench stops against the back lower rail and passes between the legs (37″)</text>
<text class="n" x="95.0" y="374.0" text-anchor="start">and the side rails (38½″ apart).</text>
<line class="ext" x1="95.0" y1="42.0" x2="95.0" y2="100.0"/>
<line class="ext" x1="599.0" y1="42.0" x2="599.0" y2="100.0"/>
<line class="dim" x1="95.0" y1="42.0" x2="599.0" y2="42.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="347.0" y="37.0" text-anchor="middle">42″ overall</text>
<line class="ext" x1="95.0" y1="68.0" x2="95.0" y2="100.0"/>
<line class="ext" x1="107.0" y1="68.0" x2="107.0" y2="100.0"/>
<line class="dim" x1="95.0" y1="68.0" x2="107.0" y2="68.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="101.0" y="63.0" text-anchor="middle">1″</text>
<line class="ext" x1="107.0" y1="68.0" x2="107.0" y2="112.0"/>
<line class="ext" x1="587.0" y1="68.0" x2="587.0" y2="112.0"/>
<line class="dim" x1="107.0" y1="68.0" x2="587.0" y2="68.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="347.0" y="63.0" text-anchor="middle">40″ leg frame</text>
<line class="ext" x1="587.0" y1="68.0" x2="587.0" y2="100.0"/>
<line class="ext" x1="599.0" y1="68.0" x2="599.0" y2="100.0"/>
<line class="dim" x1="587.0" y1="68.0" x2="599.0" y2="68.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="593.0" y="63.0" text-anchor="middle">1″</text>
<line class="ext" x1="125.0" y1="310.0" x2="125.0" y2="268.0"/>
<line class="ext" x1="569.0" y1="310.0" x2="569.0" y2="268.0"/>
<line class="dim" x1="125.0" y1="310.0" x2="569.0" y2="310.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="347.0" y="325.0" text-anchor="middle">37″ between legs</text>
<line class="dim" x1="623" y1="280.0" x2="623" y2="100.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" transform="translate(637,190.0) rotate(-90)" text-anchor="middle">15″ overall</text>
<line class="dim" x1="653" y1="268.0" x2="653" y2="112.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" transform="translate(667,190.0) rotate(-90)" text-anchor="middle">13″ leg frame</text>
</svg>
