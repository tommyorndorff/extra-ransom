<line class="ext" x1="170.5" y1="104.5" x2="170.5" y2="140.5"/>
<line class="ext" x1="489.5" y1="104.5" x2="489.5" y2="140.5"/>
<line class="dim" x1="170.5" y1="104.5" x2="489.5" y2="104.5" marker-start="url(#a)" marker-end="url(#a)"/>
