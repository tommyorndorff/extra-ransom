<text class="t" x="330.0" y="592.0" text-anchor="middle">14″ shelf width</text>
<text class="n" x="20.0" y="628.0" text-anchor="start">Legs (tan) rise past the aprons as retaining posts; the plate sits ¾″ below the apron tops on cleats (dashed).</text>
<text class="n" x="20.0" y="644.0" text-anchor="start">Dashed grey = filter body, 8½″ (Big Berkey) and 10¼″ (largest British Berkefeld) — both clear the apron faces by more than 1″.</text>
<text class="n" x="20.0" y="660.0" text-anchor="start">Dashed red = tumbler under the spigot. Shelf is shown through the frame.</text>
</svg>
