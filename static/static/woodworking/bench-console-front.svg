<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 650" width="720" height="650" role="img" aria-label="Console with bench, front elevation">
<title>Console with bench, front elevation</title>
<style>
