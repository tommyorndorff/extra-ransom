<path d="M304.2,245.1 A102,102 0 0 1 495.8,245.1 L492.1,246.5 A98,98 0 0 0 307.9,246.5 Z" fill="#7a5a3a"/>
<path d="M302.7,244.6 A103.5,103.5 0 0 1 497.3,244.6 L495.8,245.1 A102,102 0 0 0 304.2,245.1 Z" fill="#2f2f2f"/>
<path d="M298.5,243.1 A108,108 0 0 1 501.5,243.1 L497.3,244.6 A103.5,103.5 0 0 0 302.7,244.6 Z" fill="#a9b8c6" stroke="#566b80" stroke-width="0.8"/>
<polyline points="298.5,243.1 296.2,250.2 304.2,255.2" fill="none" stroke="#566b80" stroke-width="3" stroke-linecap="round"/>
<polyline points="501.5,243.1 503.8,250.2 495.8,255.2" fill="none" stroke="#566b80" stroke-width="3" stroke-linecap="round"/>
<line x1="305.0" y1="150.0" x2="495.0" y2="150.0" stroke="#777" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="325.5" y="200.0" width="9.0" height="200.0" fill="#d2b07f" stroke="#7a6040" stroke-width="1" />
<rect x="465.5" y="200.0" width="9.0" height="200.0" fill="#d2b07f" stroke="#7a6040" stroke-width="1" />
<rect x="305.0" y="183.0" width="190.0" height="17.0" fill="#d2b07f" stroke="#7a6040" stroke-width="1" fill-opacity="0.92"/>
<rect x="305.0" y="181.0" width="190.0" height="4.0" fill="#a9b8c6" stroke="#566b80" stroke-width="1" />
