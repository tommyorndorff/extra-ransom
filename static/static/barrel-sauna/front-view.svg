<line x1="370.0" y1="198.1" x2="370.0" y2="361.9" stroke="#c9a870" stroke-width="1"/>
<line x1="430.0" y1="198.1" x2="430.0" y2="361.9" stroke="#c9a870" stroke-width="1"/>
<line x1="460.0" y1="215.9" x2="460.0" y2="344.1" stroke="#c9a870" stroke-width="1"/>
