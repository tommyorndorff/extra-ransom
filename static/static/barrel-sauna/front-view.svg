<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Barrel sauna roof and porch: front view</title><desc>End view of a barrel sauna looking at the door: insulated roof layers over the top of the barrel and a freestanding porch roof on four posts in front.</desc>
<defs>
<pattern id="wool" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#f1e08a"/><line x1="0" y1="0" x2="0" y2="6" stroke="#cdb84f" stroke-width="1.5"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fa8"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c4631c"/></marker>
</defs>
<rect width="800" height="470" fill="#faf8f4" rx="8"/>
<text x="400.0" y="28" font-size="18" text-anchor="middle" font-weight="700" fill="#2b2b2b">Front view — looking at the door end</text>
<text x="400.0" y="48" font-size="12" text-anchor="middle" font-weight="400" fill="#666">Layer thickness exaggerated; not to scale</text>
