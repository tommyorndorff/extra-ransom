<text x="262" y="305" font-size="13" text-anchor="end" font-weight="600" fill="#2b2b2b">≈ 6′8″</text>
<text x="262" y="321" font-size="13" text-anchor="end" font-weight="600" fill="#2b2b2b">clear</text>
<line x1="459.3" y1="192.1" x2="548.0" y2="114.0" stroke="#2b2b2b" stroke-width="1"/>
<circle cx="459.3" cy="192.1" r="2.5" fill="#2b2b2b"/>
<text x="556" y="118" font-size="13" text-anchor="start" font-weight="400" fill="#2b2b2b">Roof: corrugated metal or shingles</text>
<line x1="471.3" y1="206.1" x2="548.0" y2="144.0" stroke="#2b2b2b" stroke-width="1"/>
<circle cx="471.3" cy="206.1" r="2.5" fill="#2b2b2b"/>
<text x="556" y="148" font-size="13" text-anchor="start" font-weight="400" fill="#2b2b2b">Underlayment, lapped shingle-style</text>
<line x1="478.8" y1="218.4" x2="548.0" y2="174.0" stroke="#2b2b2b" stroke-width="1"/>
<circle cx="478.8" cy="218.4" r="2.5" fill="#2b2b2b"/>
<text x="556" y="178" font-size="13" text-anchor="start" font-weight="400" fill="#2b2b2b">Furring strips, ~1 ft apart</text>
<line x1="483.0" y1="235.9" x2="548.0" y2="204.0" stroke="#2b2b2b" stroke-width="1"/>
<circle cx="483.0" cy="235.9" r="2.5" fill="#2b2b2b"/>
<text x="556" y="208" font-size="13" text-anchor="start" font-weight="400" fill="#2b2b2b">Comfortboard 80 strips, 1½″</text>
<line x1="485.5" y1="271.0" x2="548.0" y2="234.0" stroke="#2b2b2b" stroke-width="1"/>
<circle cx="485.5" cy="271.0" r="2.5" fill="#2b2b2b"/>
<text x="556" y="238" font-size="13" text-anchor="start" font-weight="400" fill="#2b2b2b">Cedar staves, 1⅜″ (existing)</text>
<line x1="496.8" y1="255.0" x2="548.0" y2="276.0" stroke="#2b2b2b" stroke-width="1"/>
<circle cx="496.8" cy="255.0" r="2.5" fill="#2b2b2b"/>
<text x="556" y="280" font-size="13" text-anchor="start" font-weight="400" fill="#2b2b2b">Drip edge + screened open slot</text>
<text x="556" y="296" font-size="13" text-anchor="start" font-weight="400" fill="#2b2b2b">under it (see layers diagram)</text>
<line x1="310.0" y1="192.0" x2="238.0" y2="168.0" stroke="#2b2b2b" stroke-width="1"/>
<circle cx="310.0" cy="192.0" r="2.5" fill="#2b2b2b"/>
<text x="232" y="166" font-size="13" text-anchor="end" font-weight="400" fill="#2b2b2b">Porch roof, 3″ drop per ft</text>
<text x="232" y="182" font-size="13" text-anchor="end" font-weight="400" fill="#2b2b2b">(front edge shown)</text>
<line x1="330.0" y1="150.0" x2="238.0" y2="130.0" stroke="#2b2b2b" stroke-width="1"/>
<circle cx="330.0" cy="150.0" r="2.5" fill="#2b2b2b"/>
<text x="232" y="126" font-size="13" text-anchor="end" font-weight="400" fill="#2b2b2b">Back edge of porch roof</text>
<text x="232" y="142" font-size="13" text-anchor="end" font-weight="400" fill="#2b2b2b">sits higher (dashed)</text>
<line x1="330.0" y1="330.0" x2="238.0" y2="345.0" stroke="#2b2b2b" stroke-width="1"/>
<circle cx="330.0" cy="330.0" r="2.5" fill="#2b2b2b"/>
<text x="232" y="349" font-size="13" text-anchor="end" font-weight="400" fill="#2b2b2b">Front posts 4×4</text>
<line x1="400.0" y1="320.0" x2="462.0" y2="330.0" stroke="#2b2b2b" stroke-width="1"/>
<circle cx="400.0" cy="320.0" r="2.5" fill="#2b2b2b"/>
<text x="470" y="334" font-size="13" text-anchor="start" font-weight="400" fill="#2b2b2b">Door</text>
<text x="400.0" y="438" font-size="13" text-anchor="middle" font-weight="400" fill="#444">Two more posts (not visible here) carry the back edge, one each side of the door.</text>
<text x="400.0" y="456" font-size="13" text-anchor="middle" font-weight="400" fill="#444">The porch stands on its own; no part of it is fastened to the barrel.</text>
</svg>
