<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:,">
  <title>Admin - Couch to Turkey Trot</title>
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="../css/styles.css?v=20261102">
</head>
<body>
  <main class="page">
    <p class="crumbs"><a href="../">&larr; Back to the plan</a></p>
    <h1>People</h1>
    <p class="lede">Add a person and send them their personal link. The edit link logs sessions; the view link only shows the summary.</p>
    <div class="banner" id="banner" role="status" hidden></div>

    <form class="panel inline" id="keyForm">
      <label>Admin key <input type="password" id="key" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit">Load people</button>
    </form>

    <form class="panel inline" id="addForm" hidden>
      <label>Name <input type="text" id="name" maxlength="40" required placeholder="First name or nickname"></label>
      <label>Starting level
        <select id="level">
          <option value="beginner">Starting from the couch</option>
          <option value="intermediate">Can run ~5 minutes</option>
          <option value="runner">Already running 20+ min</option>
        </select>
      </label>
      <button class="btn primary" type="submit">Add person</button>
    </form>

    <div class="panel" id="list" hidden></div>
  </main>
  <script src="../js/admin.js?v=20261102"></script>
</body>
</html>
