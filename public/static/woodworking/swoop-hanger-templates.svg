<text class="n" x="60.0" y="434.5" text-anchor="start">ARM (cut 1) — blank 1½″ × 8¼″ × 14½″, grain along the length (parallel to the blank's long edges). Top: level for 1″, then an S rising 2¼″ to 10″, level to the tip.</text>
<text class="n" x="60.0" y="450.5" text-anchor="start">Underside: leaves the root's bottom corner at 60° and sweeps into the level tip at 10″.</text>
<text class="n" x="60.0" y="466.5" text-anchor="start">Plot both edges from the ordinate tables on the plan page and bend a thin batten through the points.</text>
