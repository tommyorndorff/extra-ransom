<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 690" width="560" height="690" role="img" aria-label="Console with bench, side elevation with lid open">
<title>Console with bench, side elevation with lid open</title>
<style>
