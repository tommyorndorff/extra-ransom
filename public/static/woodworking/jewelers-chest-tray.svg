<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" role="img" aria-label="Jeweler's traveling chest, tray layout">
<title>Jeweler's traveling chest, tray layout</title>
<style>
  .bg{fill:#fff}
  .wood{fill:#ecd2ac;stroke:#4a3320;stroke-width:1.3;stroke-linejoin:round}
  .leg{fill:#dcb988;stroke:#4a3320;stroke-width:1.3}
  .face{fill:#f3dfbf;stroke:#4a3320;stroke-width:1.3}
  .pull{fill:#5a3b26;stroke:#2b1a0f;stroke-width:1}
  .shelf{fill:#e6c79c;stroke:#4a3320;stroke-width:1.3}
  .hid{fill:none;stroke:#7a6a5a;stroke-width:1.1;stroke-dasharray:5 3}
  .spacer{fill:#cfc3b4;stroke:#6b5b4b;stroke-width:1}
  .floor{stroke:#333;stroke-width:1.6}
  .dim{stroke:#1f5fa8;stroke-width:1;fill:none}
  .ext{stroke:#8fb0d8;stroke-width:.8}
  .t{font:12px 'Helvetica Neue',Arial,sans-serif;fill:#1f3a5f}
  .n{font:11px 'Helvetica Neue',Arial,sans-serif;fill:#444}
  .h{font:600 15px 'Helvetica Neue',Arial,sans-serif;fill:#222}
</style>
<defs>
  <marker id="a" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#1f5fa8"/>
  </marker>
</defs>

<defs>
  <pattern id="jh" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="#8a6a4a" stroke-width="1"/>
  </pattern>
</defs>
<style>
  .cut{fill:#d9b27c;stroke:#4a3320;stroke-width:1.2}
  .beyond{fill:#f8f1e6;stroke:#a08f7c;stroke-width:1}
  .groove{fill:#e6d6bf;stroke:#7a6a5a;stroke-width:1;stroke-dasharray:4 2}
  .dt{fill:url(#jh);stroke:#4a3320;stroke-width:1}
</style>
<rect class="bg" width="780" height="470"/>
<text class="h" x="20.0" y="24.0" text-anchor="start">Lift-out tray, plan — 1 in = 24 px (inside 20″ × 10″)</text>
<rect class="wood" x="70.00" y="80.00" width="498.00" height="258.00"/>
<rect class="wood" x="187.00" y="89.00" width="6.00" height="240.00"/>
<rect class="wood" x="331.00" y="89.00" width="6.00" height="240.00"/>
<rect class="wood" x="445.00" y="89.00" width="6.00" height="240.00"/>
<rect class="face" x="79.00" y="89.00" width="108.00" height="240.00"/>
<text class="t" x="133.0" y="188.0" text-anchor="middle">pliers + cutters</text>
<text class="n" x="133.0" y="204.0" text-anchor="middle">jaws up in a</text>
<text class="n" x="133.0" y="218.0" text-anchor="middle">slotted block,</text>
<text class="n" x="133.0" y="232.0" text-anchor="middle">8–10 tools</text>
<rect class="face" x="193.00" y="89.00" width="138.00" height="240.00"/>
<text class="t" x="262.0" y="195.0" text-anchor="middle">files</text>
<text class="n" x="262.0" y="211.0" text-anchor="middle">hand + needle files,</text>
<text class="n" x="262.0" y="225.0" text-anchor="middle">two rows, 6–8″</text>
<rect class="face" x="337.00" y="89.00" width="108.00" height="240.00"/>
<text class="t" x="391.0" y="195.0" text-anchor="middle">measuring</text>
<text class="n" x="391.0" y="211.0" text-anchor="middle">dividers, calipers,</text>
<text class="n" x="391.0" y="225.0" text-anchor="middle">rule, ring sizer</text>
<rect class="face" x="451.00" y="89.00" width="108.00" height="117.00"/>
<rect class="wood" x="451.00" y="206.00" width="108.00" height="6.00"/>
<rect class="face" x="451.00" y="212.00" width="108.00" height="117.00"/>
<text class="t" x="505.0" y="135.0" text-anchor="middle"></text>
<text class="n" x="505.0" y="151.0" text-anchor="middle">burnishers,</text>
<text class="n" x="505.0" y="165.0" text-anchor="middle">pushers, scribes</text>
<text class="t" x="505.0" y="255.0" text-anchor="middle"></text>
<text class="n" x="505.0" y="271.0" text-anchor="middle">burs in index</text>
<text class="n" x="505.0" y="285.0" text-anchor="middle">cases, loupes</text>
<line class="ext" x1="70.0" y1="50.0" x2="70.0" y2="80.0"/>
<line class="ext" x1="568.0" y1="50.0" x2="568.0" y2="80.0"/>
<line class="dim" x1="70.0" y1="50.0" x2="568.0" y2="50.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="319.0" y="45.0" text-anchor="middle">20¾″ tray</text>
<line class="ext" x1="40.0" y1="80.0" x2="70.0" y2="80.0"/>
<line class="ext" x1="40.0" y1="338.0" x2="70.0" y2="338.0"/>
<line class="dim" x1="40.0" y1="80.0" x2="40.0" y2="338.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" transform="translate(34.0,209.0) rotate(-90)" text-anchor="middle">10¾″</text>
<line class="ext" x1="79.0" y1="364.0" x2="79.0" y2="329.0"/>
<line class="ext" x1="187.0" y1="364.0" x2="187.0" y2="329.0"/>
<line class="dim" x1="79.0" y1="364.0" x2="187.0" y2="364.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="133.0" y="379.0" text-anchor="middle">4½″</text>
<line class="ext" x1="193.0" y1="364.0" x2="193.0" y2="329.0"/>
<line class="ext" x1="331.0" y1="364.0" x2="331.0" y2="329.0"/>
<line class="dim" x1="193.0" y1="364.0" x2="331.0" y2="364.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="262.0" y="379.0" text-anchor="middle">5¾″</text>
<line class="ext" x1="337.0" y1="364.0" x2="337.0" y2="329.0"/>
<line class="ext" x1="445.0" y1="364.0" x2="445.0" y2="329.0"/>
<line class="dim" x1="337.0" y1="364.0" x2="445.0" y2="364.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="391.0" y="379.0" text-anchor="middle">4½″</text>
<line class="ext" x1="451.0" y1="364.0" x2="451.0" y2="329.0"/>
<line class="ext" x1="559.0" y1="364.0" x2="559.0" y2="329.0"/>
<line class="dim" x1="451.0" y1="364.0" x2="559.0" y2="364.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="505.0" y="379.0" text-anchor="middle">4½″</text>
<line class="ext" x1="598.0" y1="89.0" x2="559.0" y2="89.0"/>
<line class="ext" x1="598.0" y1="206.0" x2="559.0" y2="206.0"/>
<line class="dim" x1="598.0" y1="89.0" x2="598.0" y2="206.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" transform="translate(612.0,147.5) rotate(-90)" text-anchor="middle">4⅞″</text>
<line class="ext" x1="598.0" y1="212.0" x2="559.0" y2="212.0"/>
<line class="ext" x1="598.0" y1="329.0" x2="559.0" y2="329.0"/>
<line class="dim" x1="598.0" y1="212.0" x2="598.0" y2="329.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" transform="translate(612.0,270.5) rotate(-90)" text-anchor="middle">4⅞″</text>
<text class="n" x="319.0" y="406.0" text-anchor="middle">FRONT — this side's lip is cut down ½″</text>
<text class="n" x="20.0" y="450.0" text-anchor="start">Mitered ⅜″ sides, ¼″ bottom, ¼″ dividers. Bottom-row and right-hand numbers are clear compartment sizes.</text>
</svg>
