<text class="t" x="259.0" y="425.0" text-anchor="start">1″ rise</text>
<text class="n" x="80.0" y="483.0" text-anchor="start">Arc: 1″ rise over the 12½″ between shoulders → radius ≈ 20″.</text>
<text class="n" x="20.0" y="515.0" text-anchor="start">Scribe each arc with a thin batten sprung through the three points, or strike it with a trammel.</text>
<text class="n" x="20.0" y="531.0" text-anchor="start">Tenons 1″ long × 1¾″ wide × 5/16″ thick (est.), centred. Dashed = the square blank before cutting.</text>
