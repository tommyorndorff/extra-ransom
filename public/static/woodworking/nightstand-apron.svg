<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" width="680" height="560" role="img" aria-label="Heartwood Shaker nightstand, arched rail blanks">
<title>Heartwood Shaker nightstand, arched rail blanks</title>
<style>
  .bg{fill:#fff}
