<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 690" width="800" height="690" role="img" aria-label="Tenoning jig end view">
<title>Tenoning jig end view</title>
<style>
  .bg{fill:#fff}
  .wood{fill:#ecd2ac;stroke:#4a3320;stroke-width:1.3;stroke-linejoin:round}
  .leg{fill:#dcb988;stroke:#4a3320;stroke-width:1.3}
  .face{fill:#f3dfbf;stroke:#4a3320;stroke-width:1.3}
  .pull{fill:#5a3b26;stroke:#2b1a0f;stroke-width:1}
  .shelf{fill:#e6c79c;stroke:#4a3320;stroke-width:1.3}
  .hid{fill:none;stroke:#7a6a5a;stroke-width:1.1;stroke-dasharray:5 3}
  .spacer{fill:#cfc3b4;stroke:#6b5b4b;stroke-width:1}
  .floor{stroke:#333;stroke-width:1.6}
  .dim{stroke:#1f5fa8;stroke-width:1;fill:none}
  .ext{stroke:#8fb0d8;stroke-width:.8}
  .t{font:12px 'Helvetica Neue',Arial,sans-serif;fill:#1f3a5f}
  .n{font:11px 'Helvetica Neue',Arial,sans-serif;fill:#444}
  .h{font:600 15px 'Helvetica Neue',Arial,sans-serif;fill:#222}
</style>
<defs>
  <marker id="a" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#1f5fa8"/>
  </marker>
</defs>
<style>
  .tjb{fill:#f1ede7;stroke:#8a8a8a;stroke-width:1}
  .tjk{fill:#444;stroke:#222;stroke-width:1}
  .tjs{fill:#fff;stroke:#4a3320;stroke-width:1}
  .tjw{fill:url(#tjh);stroke:#4a3320;stroke-width:.8}
  .tjc{fill:none;stroke:#666;stroke-width:3;stroke-linejoin:round}
  .tjt{fill:#d9d9d9;stroke:#555;stroke-width:1.2}
</style>
<defs>
  <pattern id="tjh" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="#9c7a52" stroke-width="1.1"/>
  </pattern>
</defs>
<rect class="bg" width="800" height="690"/>
<text class="h" x="20.0" y="24.0" text-anchor="start">End view looking along the feed — 1 in = 34 px</text>
<rect class="tjt" x="121.60" y="494.00" width="387.60" height="44.20"/>
<rect class="tjs" x="193.85" y="494.00" width="25.50" height="12.75"/>
<rect class="spacer" x="194.15" y="494.97" width="24.90" height="11.78"/>
<text class="n" x="503.2" y="532.2" text-anchor="end">table</text>
<text class="n" x="228.7" y="518.0" text-anchor="start">runner in ¾″ × ⅜″ slot</text>
<rect class="face" x="142.00" y="468.50" width="238.00" height="25.50"/>
<rect class="wood" x="354.50" y="128.50" width="25.50" height="340.00"/>
<text class="n" x="196.4" y="485.2" text-anchor="middle">base ¾″ ply</text>
<text class="n" x="346.5" y="269.6" text-anchor="end">fence ¾″ ply</text>
<rect class="tjb" x="245.66" y="374.80" width="37.48" height="82.99"/>
<circle class="tjb" cx="264.4" cy="374.8" r="24.1"/>
<rect class="tjb" x="237.63" y="457.79" width="53.54" height="10.71"/>
<polygon class="tjb" points="354.5,468.5 274.2,468.5 274.2,460.5 346.5,388.2 354.5,388.2"/>
<line class="ext" x1="240.3" y1="374.8" x2="162.4" y2="344.2"/>
<text class="n" x="159.4" y="348.2" text-anchor="end">handle</text>
<line class="ext" x1="320.5" y1="437.9" x2="162.4" y2="403.9"/>
<text class="n" x="159.4" y="407.9" text-anchor="end">bracket</text>
<rect class="spacer" x="380.00" y="400.30" width="17.00" height="93.70"/>
<rect class="spacer" x="397.00" y="400.30" width="4.25" height="93.70"/>
<rect class="spacer" x="401.25" y="400.30" width="2.12" height="93.70"/>
<rect class="spacer" x="380.00" y="187.80" width="17.00" height="93.70"/>
<rect class="spacer" x="397.00" y="187.80" width="4.25" height="93.70"/>
<rect class="spacer" x="401.25" y="187.80" width="2.12" height="93.70"/>
<rect class="shelf" x="403.38" y="171.00" width="25.50" height="323.00"/>
<rect class="tjk" x="422.50" y="443.00" width="4.25" height="51.00"/>
<text class="n" x="450.9" y="378.4" text-anchor="start">stock, stands on the table</text>
<text class="n" x="436.9" y="472.5" text-anchor="start">blade (⅛″ kerf)</text>
<line class="ext" x1="391.7" y1="447.1" x2="450.9" y2="324.0"/>
<text class="n" x="453.9" y="328.0" text-anchor="start"></text>
<line class="ext" x1="391.7" y1="234.6" x2="450.9" y2="324.0"/>
<text class="n" x="453.9" y="328.0" text-anchor="start"></text>
<text class="n" x="453.9" y="328.0" text-anchor="start">shim stacks ½ + ⅛ + 1/16 = 11/16″</text>
<text class="n" x="453.9" y="342.0" text-anchor="start">(printed plates, at the foot and at the clamp)</text>
<path class="tjc" d="M354.5,235.6 L344.3,235.6 L344.3,116.6 L439.1,116.6 L439.1,235.6 L428.9,235.6"/>
<rect class="pull" x="350.42" y="227.10" width="4.08" height="17.00"/>
<rect class="pull" x="428.88" y="227.10" width="4.08" height="17.00"/>
<text class="n" x="391.7" y="108.6" text-anchor="middle">C-clamp: fence back to stock face, above the blade</text>
<line class="dim" x1="380.0" y1="62.0" x2="422.5" y2="62.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="401.2" y="57.0" text-anchor="middle">A = 1¼″ fence face to blade's near plane</text>
<line class="ext" x1="380.0" y1="62" x2="380.0" y2="128.5"/>
<line class="ext" x1="422.5" y1="62" x2="422.5" y2="443.0"/>
<line class="dim" x1="100.0" y1="128.5" x2="100.0" y2="468.5" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" transform="translate(94.0,298.5) rotate(-90)" text-anchor="middle">fence 10″</text>
<line class="ext" x1="100" y1="128.5" x2="354.5" y2="128.5"/>
<line class="ext" x1="100" y1="468.5" x2="142.0" y2="468.5"/>
<line class="dim" x1="100.0" y1="468.5" x2="100.0" y2="494.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="95.0" y="485.2" text-anchor="end">base ¾″</text>
<line class="ext" x1="100" y1="494.0" x2="121.6" y2="494.0"/>
<line class="ext" x1="596.8" y1="443.0" x2="426.8" y2="443.0"/>
<line class="ext" x1="596.8" y1="494.0" x2="426.8" y2="494.0"/>
<line class="dim" x1="596.8" y1="443.0" x2="596.8" y2="494.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="601.8" y="472.5" text-anchor="start">blade 1½″ = tenon length</text>
<line class="ext" x1="403.4" y1="562.2" x2="403.4" y2="494.0"/>
<line class="ext" x1="428.9" y1="562.2" x2="428.9" y2="494.0"/>
<line class="dim" x1="389.4" y1="562.2" x2="403.4" y2="562.2" marker-end="url(#a)"/>
<line class="dim" x1="442.9" y1="562.2" x2="428.9" y2="562.2" marker-end="url(#a)"/>
<text class="t" x="446.9" y="566.2" text-anchor="start">t = ¾″ stock</text>
<line class="ext" x1="403.4" y1="588.2" x2="403.4" y2="494.0"/>
<line class="ext" x1="422.5" y1="588.2" x2="422.5" y2="494.0"/>
<line class="dim" x1="389.4" y1="588.2" x2="403.4" y2="588.2" marker-end="url(#a)"/>
<line class="dim" x1="436.5" y1="588.2" x2="422.5" y2="588.2" marker-end="url(#a)"/>
<text class="t" x="440.5" y="592.2" text-anchor="start">(t + T)/2 = 9/16″ shim face to blade</text>
<line class="ext" x1="142.0" y1="614.2" x2="142.0" y2="494.0"/>
<line class="ext" x1="380.0" y1="614.2" x2="380.0" y2="494.0"/>
<line class="dim" x1="142.0" y1="614.2" x2="380.0" y2="614.2" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="261.0" y="629.2" text-anchor="middle">base 7″ wide</text>
<line class="ext" x1="380.0" y1="614.2" x2="380.0" y2="494.0"/>
<line class="ext" x1="403.4" y1="614.2" x2="403.4" y2="494.0"/>
<line class="dim" x1="366.0" y1="614.2" x2="380.0" y2="614.2" marker-end="url(#a)"/>
<line class="dim" x1="417.4" y1="614.2" x2="403.4" y2="614.2" marker-end="url(#a)"/>
<text class="t" x="421.4" y="618.2" text-anchor="start">s = 11/16″ shim stack</text>
<text class="n" x="125.0" y="644.2" text-anchor="start">Example: ¾″ stock, ⅜″ tenon: s = A − (t + T)/2 = 1¼″ − 9/16″ = 11/16″. The slot-to-blade distance is saw-dependent;</text>
<text class="n" x="125.0" y="660.2" text-anchor="start">the base's cross slots let you set A once. Light fill = handle and bracket seen beyond.</text>
</svg>
