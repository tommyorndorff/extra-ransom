<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440" role="img" aria-label="Chest bench end section">
<title>Chest bench end section</title>
<style>
  .bg{fill:#fff}
