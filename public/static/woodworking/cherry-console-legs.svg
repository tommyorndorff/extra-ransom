<text class="n" x="20.0" y="540.0" text-anchor="start">Front-left leg shown. The back-right leg is the same part turned end for end; the front-right and back-left legs are mirror images.</text>
<text class="n" x="20.0" y="556.0" text-anchor="start">Mortises 5/16″ wide × 1″ deep, 7/32″ in from the outer face (tenon centred on the ¾″ apron or rail — see the drawbore section).</text>
<text class="n" x="20.0" y="572.0" text-anchor="start">Mortise length = tenon width, which this plan leaves to you (e.g. a haunch at the top). Pins Ø⅛″, ½″ from the shoulder face, drilled</text>
<text class="n" x="20.0" y="588.0" text-anchor="start">from the outer faces; stagger the 1–2 rail pins the same way. Blue ○ = pin, A–D = leg corners.</text>
