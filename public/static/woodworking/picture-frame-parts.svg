<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" width="720" height="600" role="img" aria-label="Picture frame, parts and stick layout">
<title>Picture frame, parts and stick layout</title>
<style>
  .bg{fill:#fff}
  .wood{fill:#ecd2ac;stroke:#4a3320;stroke-width:1.3;stroke-linejoin:round}
  .leg{fill:#dcb988;stroke:#4a3320;stroke-width:1.3}
  .face{fill:#f3dfbf;stroke:#4a3320;stroke-width:1.3}
  .pull{fill:#5a3b26;stroke:#2b1a0f;stroke-width:1}
  .shelf{fill:#e6c79c;stroke:#4a3320;stroke-width:1.3}
  .hid{fill:none;stroke:#7a6a5a;stroke-width:1.1;stroke-dasharray:5 3}
  .spacer{fill:#cfc3b4;stroke:#6b5b4b;stroke-width:1}
  .floor{stroke:#333;stroke-width:1.6}
  .dim{stroke:#1f5fa8;stroke-width:1;fill:none}
  .ext{stroke:#8fb0d8;stroke-width:.8}
  .t{font:12px 'Helvetica Neue',Arial,sans-serif;fill:#1f3a5f}
  .n{font:11px 'Helvetica Neue',Arial,sans-serif;fill:#444}
  .h{font:600 15px 'Helvetica Neue',Arial,sans-serif;fill:#222}
</style>
<defs>
  <marker id="a" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#1f5fa8"/>
  </marker>
</defs>
<rect class="bg" width="720" height="600"/>
<text class="h" x="20.0" y="24.0" text-anchor="start">Parts, seen from the back — 1 in = 26 px</text>
<text class="t" x="20.0" y="52.0" text-anchor="start">Rail — cut 2 at 17½″, 45° both ends (top and bottom)</text>
<polygon class="wood" points="90.0,92.0 545.0,92.0 522.2,114.8 112.8,114.8"/>
<polygon class="shelf" points="112.8,114.8 522.2,114.8 512.5,124.5 122.5,124.5"/>
<line class="ext" x1="90.0" y1="80.0" x2="90.0" y2="92.0"/>
<line class="ext" x1="545.0" y1="80.0" x2="545.0" y2="92.0"/>
<line class="dim" x1="90.0" y1="80.0" x2="545.0" y2="80.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="317.5" y="75.0" text-anchor="middle">17½″ long point (outside edge)</text>
<line class="ext" x1="112.8" y1="146.5" x2="112.8" y2="114.8"/>
<line class="ext" x1="522.2" y1="146.5" x2="522.2" y2="114.8"/>
<line class="dim" x1="112.8" y1="146.5" x2="522.2" y2="146.5" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="317.5" y="161.5" text-anchor="middle">15¾″ at the rabbet wall</text>
<line class="ext" x1="122.5" y1="174.5" x2="122.5" y2="124.5"/>
<line class="ext" x1="512.5" y1="174.5" x2="512.5" y2="124.5"/>
<line class="dim" x1="122.5" y1="174.5" x2="512.5" y2="174.5" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="317.5" y="189.5" text-anchor="middle">15″ short point (= sight)</text>
<line class="ext" x1="68.0" y1="92.0" x2="122.5" y2="92.0"/>
<line class="ext" x1="68.0" y1="124.5" x2="122.5" y2="124.5"/>
<line class="dim" x1="68.0" y1="92.0" x2="68.0" y2="124.5" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" transform="translate(62.0,108.2) rotate(-90)" text-anchor="middle">1¼″</text>
<line class="ext" x1="559.0" y1="114.8" x2="512.5" y2="114.8"/>
<line class="ext" x1="559.0" y1="124.5" x2="512.5" y2="124.5"/>
<line class="dim" x1="559.0" y1="114.8" x2="559.0" y2="124.5" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="564.0" y="123.6" text-anchor="start">⅜″ rabbet floor, ½″ down</text>
<text class="n" x="317.5" y="107.4" text-anchor="middle">⅞″ wall</text>
<text class="t" x="20.0" y="222.0" text-anchor="start">Stile — cut 2 at 13⅜″, 45° both ends (sides)</text>
<polygon class="wood" points="90.0,262.0 437.8,262.0 415.0,284.8 112.8,284.8"/>
<polygon class="shelf" points="112.8,284.8 415.0,284.8 405.2,294.5 122.5,294.5"/>
<line class="ext" x1="90.0" y1="250.0" x2="90.0" y2="262.0"/>
<line class="ext" x1="437.8" y1="250.0" x2="437.8" y2="262.0"/>
<line class="dim" x1="90.0" y1="250.0" x2="437.8" y2="250.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="263.9" y="245.0" text-anchor="middle">13⅜″ long point (outside edge)</text>
<line class="ext" x1="112.8" y1="316.5" x2="112.8" y2="284.8"/>
<line class="ext" x1="415.0" y1="316.5" x2="415.0" y2="284.8"/>
<line class="dim" x1="112.8" y1="316.5" x2="415.0" y2="316.5" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="263.9" y="331.5" text-anchor="middle">11⅝″ at the rabbet wall</text>
<line class="ext" x1="122.5" y1="344.5" x2="122.5" y2="294.5"/>
<line class="ext" x1="405.2" y1="344.5" x2="405.2" y2="294.5"/>
<line class="dim" x1="122.5" y1="344.5" x2="405.2" y2="344.5" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="263.9" y="359.5" text-anchor="middle">10⅞″ short point (= sight)</text>
<line class="ext" x1="68.0" y1="262.0" x2="122.5" y2="262.0"/>
<line class="ext" x1="68.0" y1="294.5" x2="122.5" y2="294.5"/>
<line class="dim" x1="68.0" y1="262.0" x2="68.0" y2="294.5" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" transform="translate(62.0,278.2) rotate(-90)" text-anchor="middle">1¼″</text>
<line class="ext" x1="451.8" y1="284.8" x2="405.2" y2="284.8"/>
<line class="ext" x1="451.8" y1="294.5" x2="405.2" y2="294.5"/>
<line class="dim" x1="451.8" y1="284.8" x2="451.8" y2="294.5" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="456.8" y="293.6" text-anchor="start">⅜″ rabbet floor, ½″ down</text>
<text class="n" x="263.9" y="277.4" text-anchor="middle">⅞″ wall</text>
<text class="t" x="20.0" y="430.0" text-anchor="start">Cutting one 6′ stick — 1 in = 9 px (miters alternate so neighbours share a cut)</text>
<rect class="spacer" x="30.00" y="470.00" width="648.00" height="11.25"/>
<polygon class="wood" points="30.0,481.2 187.5,481.2 176.2,470.0 41.2,470.0"/>
<text class="n" x="108.8" y="464.0" text-anchor="middle">rail 17½″</text>
<polygon class="wood" points="177.8,470.0 298.2,470.0 287.0,481.2 189.1,481.2"/>
<text class="n" x="238.0" y="464.0" text-anchor="middle">stile 13⅜″</text>
<polygon class="wood" points="288.6,481.2 446.1,481.2 434.8,470.0 299.8,470.0"/>
<text class="n" x="367.3" y="464.0" text-anchor="middle">rail 17½″</text>
<polygon class="wood" points="436.4,470.0 556.8,470.0 545.5,481.2 447.6,481.2"/>
<text class="n" x="496.6" y="464.0" text-anchor="middle">stile 13⅜″</text>
<line class="ext" x1="30.0" y1="503.2" x2="30.0" y2="481.2"/>
<line class="ext" x1="556.8" y1="503.2" x2="556.8" y2="481.2"/>
<line class="dim" x1="30.0" y1="503.2" x2="556.8" y2="503.2" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="293.4" y="518.2" text-anchor="middle">≈ 58½″ used, with 3 kerfs</text>
<line class="ext" x1="556.8" y1="503.2" x2="556.8" y2="481.2"/>
<line class="ext" x1="678.0" y1="503.2" x2="678.0" y2="481.2"/>
<line class="dim" x1="556.8" y1="503.2" x2="678.0" y2="503.2" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="617.4" y="518.2" text-anchor="middle">≈ 13½″ left</text>
<text class="n" x="20.0" y="560.0" text-anchor="start">Four pieces = 61¾″ of long points; each shared cut saves 1¼″, so the run is 58″ + kerfs. Keep the offcut for test miters.</text>
</svg>
