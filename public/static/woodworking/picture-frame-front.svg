<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" width="720" height="580" role="img" aria-label="Picture frame, front elevation">
<title>Picture frame, front elevation</title>
<style>
