<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-label="Chest bench front elevation">
<title>Chest bench front elevation</title>
<style>
  .bg{fill:#fff}
