<text class="n" x="20.0" y="626.0" text-anchor="start">Dashed grey = ⅜″ mortises for the ¾″ parts (end and back aprons, lower rail), 3/16″ in from the face the part is flush with.</text>
<text class="n" x="20.0" y="642.0" text-anchor="start">Dotted red = ½″ mortises for the 1¼″ shelf end rails, ⅜″ in from the outside face. Tenons are centred on each part's thickness.</text>
<text class="n" x="20.0" y="658.0" text-anchor="start">All tenons are 1″ long, so cut the mortises a little deeper. Every part is flush with an outside face, so mortises on adjacent faces never meet.</text>
