<line class="ext" x1="201.2" y1="747.5" x2="201.2" y2="657.5"/>
<line class="ext" x1="298.8" y1="747.5" x2="298.8" y2="657.5"/>
<line class="dim" x1="201.2" y1="747.5" x2="298.8" y2="747.5" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="250.0" y="762.5" text-anchor="middle">9¾″ between legs at the tops</text>
<text class="n" x="20.0" y="808.0" text-anchor="start">Dashed grey = a BOROUX 3-Gallon (base ⌀9½″, 23″ tall) sitting on the X. Dashed red = a 30 oz tumbler on the shelf.</text>
<text class="n" x="20.0" y="824.0" text-anchor="start">The legs are vertical and 2″ wide at the top; the inside face is plumb to the X, then tapers outward to 1⅛″ at the foot. The cup stands in the corner, in front of or behind the X, not under it.</text>
