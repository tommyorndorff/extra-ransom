<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 842" width="1000" height="842" role="img" aria-label="Floor stand, front and side elevations">
<title>Floor stand, front and side elevations</title>
<style>
  .bg{fill:#fff}
