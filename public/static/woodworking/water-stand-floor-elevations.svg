<line class="dim" x1="141.2" y1="320.0" x2="141.2" y2="345.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" transform="translate(135.2,332.5) rotate(-90)" text-anchor="middle">2½″ bar</text>
<line class="ext" x1="105.2" y1="300.0" x2="197.2" y2="300.0"/>
<line class="ext" x1="105.2" y1="320.0" x2="197.2" y2="320.0"/>
