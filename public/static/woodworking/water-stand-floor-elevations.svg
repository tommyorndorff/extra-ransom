<text class="n" x="720.0" y="205.0" text-anchor="middle">BOROUX 3-gal</text>
<text class="n" x="720.0" y="219.0" text-anchor="middle">base ⌀9½″ × 23″</text>
<line class="ext" x1="358.8" y1="300.0" x2="322.8" y2="300.0"/>
<line class="ext" x1="358.8" y1="657.5" x2="322.8" y2="657.5"/>
<line class="dim" x1="358.8" y1="300.0" x2="358.8" y2="657.5" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" transform="translate(372.8,478.8) rotate(-90)" text-anchor="middle">35¾″ legs</text>
<line class="ext" x1="394.8" y1="320.0" x2="302.8" y2="320.0"/>
<line class="ext" x1="394.8" y1="657.5" x2="302.8" y2="657.5"/>
<line class="dim" x1="394.8" y1="320.0" x2="394.8" y2="657.5" marker-start="url(#a)" marker-end="url(#a)"/>
