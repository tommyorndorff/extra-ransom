  .cup{fill:none;stroke:#b0452b;stroke-width:1.2;stroke-dasharray:3 3}
  .ctr{stroke:#999;stroke-width:.8;stroke-dasharray:10 3 2 3}
  .cut{fill:#fff;stroke:#4a3320;stroke-width:1.3}
</style>
