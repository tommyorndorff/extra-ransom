<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750" role="img" aria-label="Countertop stand, front and side elevations">
<title>Countertop stand, front and side elevations</title>
<style>
  .bg{fill:#fff}
  .wood{fill:#ecd2ac;stroke:#4a3320;stroke-width:1.3;stroke-linejoin:round}
  .leg{fill:#dcb988;stroke:#4a3320;stroke-width:1.3}
  .face{fill:#f3dfbf;stroke:#4a3320;stroke-width:1.3}
  .pull{fill:#5a3b26;stroke:#2b1a0f;stroke-width:1}
  .shelf{fill:#e6c79c;stroke:#4a3320;stroke-width:1.3}
  .hid{fill:none;stroke:#7a6a5a;stroke-width:1.1;stroke-dasharray:5 3}
  .spacer{fill:#cfc3b4;stroke:#6b5b4b;stroke-width:1}
  .floor{stroke:#333;stroke-width:1.6}
  .dim{stroke:#1f5fa8;stroke-width:1;fill:none}
  .ext{stroke:#8fb0d8;stroke-width:.8}
  .t{font:12px 'Helvetica Neue',Arial,sans-serif;fill:#1f3a5f}
  .n{font:11px 'Helvetica Neue',Arial,sans-serif;fill:#444}
  .h{font:600 15px 'Helvetica Neue',Arial,sans-serif;fill:#222}
</style>
<defs>
  <marker id="a" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#1f5fa8"/>
  </marker>
</defs>

<style>
  .post{fill:#dcb988;stroke:#4a3320;stroke-width:1.3;stroke-linejoin:round}
  .ap{fill:#ecd2ac;stroke:#4a3320;stroke-width:1.3;stroke-linejoin:round}
  .shelfp{fill:#e6c79c;stroke:#4a3320;stroke-width:1.3;stroke-linejoin:round}
  .ghost{fill:#eef1f4;fill-opacity:.55;stroke:#6b7885;stroke-width:1.2;stroke-dasharray:6 4}
  .cup{fill:none;stroke:#b0452b;stroke-width:1.2;stroke-dasharray:3 3}
  .ctr{stroke:#999;stroke-width:.8;stroke-dasharray:10 3 2 3}
  .cut{fill:#fff;stroke:#4a3320;stroke-width:1.3}
</style>
<rect class="bg" width="1000" height="750"/>
<text class="h" x="20.0" y="26.0" text-anchor="start">Countertop stand — front and side elevations (1 in = 15 px)</text>
<line class="floor" x1="55.0" y1="565.0" x2="915.0" y2="565.0"/>
<text class="h" x="250.0" y="75.0" text-anchor="middle">FRONT</text>
<rect class="ap" x="176.88" y="445.00" width="146.25" height="37.50"/>
<rect class="post" x="240.62" y="415.00" width="18.75" height="150.00"/>
<polygon class="post" points="146.9,415.0 176.9,415.0 176.9,482.5 174.6,565.0 146.9,565.0"/>
<polygon class="post" points="353.1,415.0 323.1,415.0 323.1,482.5 325.4,565.0 353.1,565.0"/>
<rect class="ghost" x="178.75" y="100.00" width="142.50" height="345.00"/>
<rect class="cup" x="151.53" y="452.50" width="49.50" height="112.50"/>
<text class="n" x="250.0" y="272.5" text-anchor="middle">BOROUX 3-gal</text>
<text class="n" x="250.0" y="286.5" text-anchor="middle">base ⌀9½″ × 23″</text>
<text class="h" x="720.0" y="75.0" text-anchor="middle">SIDE</text>
<rect class="ap" x="646.88" y="445.00" width="146.25" height="37.50"/>
<rect class="post" x="710.62" y="415.00" width="18.75" height="150.00"/>
<polygon class="post" points="616.9,415.0 646.9,415.0 646.9,482.5 644.6,565.0 616.9,565.0"/>
<polygon class="post" points="823.1,415.0 793.1,415.0 793.1,482.5 795.4,565.0 823.1,565.0"/>
<rect class="ghost" x="648.75" y="100.00" width="142.50" height="345.00"/>
<rect class="cup" x="768.97" y="452.50" width="49.50" height="112.50"/>
<text class="n" x="720.0" y="272.5" text-anchor="middle">BOROUX 3-gal</text>
<text class="n" x="720.0" y="286.5" text-anchor="middle">base ⌀9½″ × 23″</text>
<line class="ext" x1="393.1" y1="415.0" x2="357.1" y2="415.0"/>
<line class="ext" x1="393.1" y1="565.0" x2="357.1" y2="565.0"/>
<line class="dim" x1="393.1" y1="415.0" x2="393.1" y2="565.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" transform="translate(407.1,490.0) rotate(-90)" text-anchor="middle">10″ legs</text>
<line class="ext" x1="429.1" y1="445.0" x2="327.1" y2="445.0"/>
<line class="ext" x1="429.1" y1="565.0" x2="327.1" y2="565.0"/>
<line class="dim" x1="429.1" y1="445.0" x2="429.1" y2="565.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" transform="translate(443.1,505.0) rotate(-90)" text-anchor="middle">8″ X top</text>
<line class="ext" x1="106.9" y1="445.0" x2="172.9" y2="445.0"/>
<line class="ext" x1="106.9" y1="482.5" x2="172.9" y2="482.5"/>
<line class="dim" x1="106.9" y1="445.0" x2="106.9" y2="482.5" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" transform="translate(100.9,463.8) rotate(-90)" text-anchor="middle">2½″ bar</text>
<line class="ext" x1="70.9" y1="415.0" x2="172.9" y2="415.0"/>
<line class="ext" x1="70.9" y1="445.0" x2="172.9" y2="445.0"/>
<line class="dim" x1="70.9" y1="415.0" x2="70.9" y2="445.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" transform="translate(64.9,430.0) rotate(-90)" text-anchor="middle">2″ post</text>
<line class="ext" x1="146.9" y1="595.0" x2="146.9" y2="565.0"/>
<line class="ext" x1="353.1" y1="595.0" x2="353.1" y2="565.0"/>
<line class="dim" x1="146.9" y1="595.0" x2="353.1" y2="595.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="250.0" y="610.0" text-anchor="middle">13¾″ outside (the legs are vertical)</text>
<line class="ext" x1="174.6" y1="625.0" x2="174.6" y2="565.0"/>
<line class="ext" x1="325.4" y1="625.0" x2="325.4" y2="565.0"/>
<line class="dim" x1="174.6" y1="625.0" x2="325.4" y2="625.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="250.0" y="640.0" text-anchor="middle">10 1/16″ between legs at the feet</text>
<line class="ext" x1="176.9" y1="655.0" x2="176.9" y2="565.0"/>
<line class="ext" x1="323.1" y1="655.0" x2="323.1" y2="565.0"/>
<line class="dim" x1="176.9" y1="655.0" x2="323.1" y2="655.0" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="250.0" y="670.0" text-anchor="middle">9¾″ between legs at the tops</text>
<text class="n" x="20.0" y="716.0" text-anchor="start">Dashed grey = a BOROUX 3-Gallon (base ⌀9½″, 23″ tall) sitting on the X. Dashed red = a 30 oz tumbler on the counter.</text>
<text class="n" x="20.0" y="732.0" text-anchor="start">The legs are vertical and 2″ wide at the top; the inside face is plumb to the X, then tapers outward to 1⅞″ at the foot. The cup stands in the corner, in front of or behind the X, not under it.</text>
</svg>
