<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 760" width="880" height="760" role="img" aria-label="Countertop stand, plan view">
<title>Countertop stand, plan view</title>
<style>
  .bg{fill:#fff}
  .wood{fill:#ecd2ac;stroke:#4a3320;stroke-width:1.3;stroke-linejoin:round}
  .leg{fill:#dcb988;stroke:#4a3320;stroke-width:1.3}
  .face{fill:#f3dfbf;stroke:#4a3320;stroke-width:1.3}
  .pull{fill:#5a3b26;stroke:#2b1a0f;stroke-width:1}
  .shelf{fill:#e6c79c;stroke:#4a3320;stroke-width:1.3}
  .hid{fill:none;stroke:#7a6a5a;stroke-width:1.1;stroke-dasharray:5 3}
  .spacer{fill:#cfc3b4;stroke:#6b5b4b;stroke-width:1}
  .floor{stroke:#333;stroke-width:1.6}
  .dim{stroke:#1f5fa8;stroke-width:1;fill:none}
  .ext{stroke:#8fb0d8;stroke-width:.8}
  .t{font:12px 'Helvetica Neue',Arial,sans-serif;fill:#1f3a5f}
  .n{font:11px 'Helvetica Neue',Arial,sans-serif;fill:#444}
  .h{font:600 15px 'Helvetica Neue',Arial,sans-serif;fill:#222}
</style>
<defs>
  <marker id="a" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#1f5fa8"/>
  </marker>
</defs>

<style>
  .post{fill:#dcb988;stroke:#4a3320;stroke-width:1.3;stroke-linejoin:round}
  .ap{fill:#ecd2ac;stroke:#4a3320;stroke-width:1.3;stroke-linejoin:round}
  .shelfp{fill:#e6c79c;stroke:#4a3320;stroke-width:1.3;stroke-linejoin:round}
  .ghost{fill:#eef1f4;fill-opacity:.55;stroke:#6b7885;stroke-width:1.2;stroke-dasharray:6 4}
  .cup{fill:none;stroke:#b0452b;stroke-width:1.2;stroke-dasharray:3 3}
  .ctr{stroke:#999;stroke-width:.8;stroke-dasharray:10 3 2 3}
  .cut{fill:#fff;stroke:#4a3320;stroke-width:1.3}
</style>
<rect class="bg" width="880" height="760"/>
<text class="h" x="20.0" y="26.0" text-anchor="start">Countertop stand — plan, looking down (1 in = 22 px)</text>
<rect class="hid" x="248.8" y="371.2" width="40.6" height="27.5"/>
<rect class="hid" x="386.2" y="233.8" width="27.5" height="40.6"/>
<rect class="hid" x="510.6" y="371.2" width="40.6" height="27.5"/>
<rect class="hid" x="386.2" y="495.6" width="27.5" height="40.6"/>
<rect class="ap" x="292.75" y="374.00" width="214.50" height="22.00"/>
<rect class="ap" x="389.00" y="277.75" width="22.00" height="214.50"/>
<rect class="post" x="248.75" y="371.25" width="44.00" height="27.50"/>
<rect class="post" x="386.25" y="233.75" width="27.50" height="44.00"/>
<rect class="post" x="507.25" y="371.25" width="44.00" height="27.50"/>
<rect class="post" x="386.25" y="492.25" width="27.50" height="44.00"/>
<circle class="ghost" cx="400.0" cy="385.0" r="104.5"/>
<text class="t" x="448.4" y="358.6" text-anchor="middle">filter on the X</text>
<text class="n" x="448.4" y="372.6" text-anchor="middle">base ⌀9½″</text>
<line x1="326.1" y1="458.9" x2="285.7" y2="499.3" stroke="#6b7885" stroke-width="5" stroke-dasharray="5 3"/>
<circle class="cup" cx="291.9" cy="493.1" r="36.3"/>
<text class="n" x="291.9" y="497.1" text-anchor="middle">cup</text>
<line class="ext" x1="248.8" y1="209.8" x2="248.8" y2="371.2"/>
<line class="ext" x1="551.2" y1="209.8" x2="551.2" y2="371.2"/>
<line class="dim" x1="248.8" y1="209.8" x2="551.2" y2="209.8" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="400.0" y="204.8" text-anchor="middle">13¾″ outside (legs vertical)</text>
<line class="ext" x1="289.4" y1="179.8" x2="289.4" y2="371.2"/>
<line class="ext" x1="510.6" y1="179.8" x2="510.6" y2="371.2"/>
<line class="dim" x1="289.4" y1="179.8" x2="510.6" y2="179.8" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="400.0" y="174.8" text-anchor="middle">10 1/16″ between legs at the feet (dashed)</text>
<line class="ext" x1="292.8" y1="626.2" x2="292.8" y2="385.0"/>
<line class="ext" x1="507.2" y1="626.2" x2="507.2" y2="385.0"/>
<line class="dim" x1="292.8" y1="626.2" x2="507.2" y2="626.2" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="400.0" y="621.2" text-anchor="middle">9¾″ between legs at the tops</text>
<text class="n" x="20.0" y="708.0" text-anchor="start">Four legs at the compass points; the two cross members (the X) are half-lapped at the centre and Domino'd into the legs' plumb inside faces.</text>
<text class="n" x="20.0" y="724.0" text-anchor="start">The filter's base ring (dashed circle) drops between the legs and sits on the X; the legs stand above it as posts.</text>
<text class="n" x="20.0" y="740.0" text-anchor="start">Spigot faces the open diagonal; the cup stands on the counter under it.</text>
</svg>
