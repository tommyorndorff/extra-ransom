<text class="n" x="640.0" y="330.0" text-anchor="start">Front cherry (cut); side seen beyond; back and bottom beech.</text>
<text class="n" x="640.0" y="345.0" text-anchor="start">Bottom ¼″ in ¼″ × ¼″ grooves, its top face</text>
<text class="n" x="640.0" y="360.0" text-anchor="start">½″ up (derived: 2½″ − 2″ inside).</text>
<text class="n" x="640.0" y="375.0" text-anchor="start">Half-blind dovetails at the front leave a ¼″ lap (derived</text>
<text class="n" x="640.0" y="390.0" text-anchor="start">from the 8½″ side); through dovetails at the back.</text>
<text class="n" x="640.0" y="405.0" text-anchor="start">Box bottom flush with the front's lower edge (est.).</text>
