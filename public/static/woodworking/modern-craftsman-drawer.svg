<text class="n" x="313.8" y="364.0" text-anchor="middle">FRONT</text>
<text class="n" x="20.0" y="392.0" text-anchor="start">Cut parts solid; drawer bottom (light) seen below; hatched = dovetailed corners. Right bay mirrors this one about the runner.</text>
<text class="n" x="20.0" y="408.0" text-anchor="start">The stated 18″ interior + two ½″ sides = 19″ box; the bay is 19⅞″ between slide faces, so 7/16″ per side —</text>
<text class="n" x="20.0" y="424.0" text-anchor="start">1/16″ short of ½″ side-mount slides. See Open questions on the plan page.</text>
<text class="h" x="640.0" y="92.0" text-anchor="start">Drawer box — side section, 1 in = 24 px</text>
