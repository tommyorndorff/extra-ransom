name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Astro + Starlight build: also runs the Starlight link validator
      # (fails the build on a broken internal link) and Pagefind indexing.
      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::693172545856:role/extra-ransom-github-deploy
          aws-region: us-east-1

      # Sync with the AWS CLI. Two passes give long-lived assets a 1-year
      # immutable cache and everything else (html/xml/json/...) a
      # must-revalidate cache.
      #
      # Pagefind (the site search) writes fixed-name files into /pagefind/
      # (pagefind.js, pagefind-ui.js/css, entry json, ...) whose names do NOT
      # change when the index changes, so they must never get the immutable
      # cache: pass 1 excludes pagefind/*, pass 2 re-includes it. Astro's
      # content-hashed files in /_astro/ keep the immutable cache.
      # (Later --include/--exclude filters override earlier ones.)
      - name: Deploy to S3
        run: |
          aws s3 sync ./dist/ s3://www.extra-ransom.net/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*" \
            --include "*.css" --include "*.js" --include "*.svg" \
            --include "*.png" --include "*.jpg" --include "*.jpeg" --include "*.gif" --include "*.webp" \
            --include "*.woff" --include "*.woff2" --include "*.ttf" --include "*.ico" \
            --exclude "pagefind/*"
          aws s3 sync ./dist/ s3://www.extra-ransom.net/ \
            --delete \
            --cache-control "public, max-age=0, must-revalidate" \
            --exclude "*.css" --exclude "*.js" --exclude "*.svg" \
            --exclude "*.png" --exclude "*.jpg" --exclude "*.jpeg" --exclude "*.gif" --exclude "*.webp" \
            --exclude "*.woff" --exclude "*.woff2" --exclude "*.ttf" --exclude "*.ico" \
            --include "pagefind/*"

      # "/*" (not "/") so deep paths actually get invalidated - see the
      # "Known Limitations" note in AGENTS.md. Still just 1 of the 1000
      # free invalidation paths per month.
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E2498U24MEPPED --paths "/*"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: extra-ransom.net
