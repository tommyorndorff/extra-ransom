name = "c25k-api"
main = "src/index.js"
compatibility_date = "2026-04-01"

# Served on the main site's domain so the page can call it same-origin.
# (extra-ransom.net DNS is on Cloudflare; the route needs the www record proxied.)
routes = [
  { pattern = "www.extra-ransom.net/api/c25k/*", zone_name = "extra-ransom.net" }
]

[[d1_databases]]
binding = "DB"
database_name = "c25k"
# From `npx wrangler d1 create c25k` (an identifier, not a secret; see README.md).
database_id = "3601644e-707f-41e9-a766-bc294a91a9c3"
migrations_dir = "migrations"

# Secret, not stored here:  npx wrangler secret put ADMIN_KEY
